<html lang="en">

<script>
/* P4 — start-up fail-safe. Lives in index.html because it has to work when the app bundle is what failed.
   TBX_PROBE(ms): does OUR site answer? A HEAD request skips the service worker (it only serves GET), so the cached app
     can't fake it, and behind a hospital captive portal the TLS handshake fails → false. navigator.onLine alone lies there.
   TBX_FAIL(phase, err): keep the saved login, reset __tbxBooted, show the "ToolBox didn't open" card.
   The 4-second watchdog below never wipes while offline, never unregisters the service worker, and only ever deletes
   the app-shell cache (tbx-vNNN-…) — never the photo cache (tbx-img) or queued feedback (tbx-fbq). */
(function () {
  var SHELL = /^tbx-v\d+-/;
  window.TBX_PROBE = function (ms) {
    if (navigator.onLine === false) return Promise.resolve(false);
    return new Promise(function (res) {
      var done = false, ac = null;
      try { ac = new AbortController(); } catch (e) {}
      var t = setTimeout(function () { if (!done) { done = true; try { if (ac) ac.abort(); } catch (e) {} res(false); } }, ms || 4000);
      try {
        fetch('./?probe=' + Date.now(), { method: 'HEAD', cache: 'no-store', signal: ac ? ac.signal : undefined }).then(function (r) {
          if (!done) { done = true; clearTimeout(t); res(r.status > 0 && r.status < 500); }
        }, function () { if (!done) { done = true; clearTimeout(t); res(false); } });
      } catch (e) { done = true; clearTimeout(t); res(false); }
    });
  };
  function unsent() {
    var n = 0, fa = false;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (/^tbx_.+_ops$/.test(k)) { try { n += (JSON.parse(localStorage.getItem(k) || '[]') || []).length; } catch (e) {} }
      }
      fa = !!localStorage.getItem('tbx_fa2_pend');
    } catch (e) {}
    return { n: n, fa: fa };
  }
  function appVer() { var s = document.querySelector('script[src^="app-"]'); var m = s && /app-([\d.]+)\.js/.exec(s.getAttribute('src')); return m ? m[1] : '?'; }
  function update(btn) {
    btn.disabled = true; btn.textContent = 'Checking…';
    function reset(t) { btn.textContent = t; setTimeout(function () { btn.disabled = false; btn.textContent = 'Check for update'; }, 2600); }
    if (!(navigator.serviceWorker && navigator.serviceWorker.getRegistration)) return reset('Not available here');
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) throw 0;
      return reg.update().then(function () {
        return new Promise(function (res) {
          var t0 = Date.now();
          (function poll() { if (reg.waiting) return res(reg.waiting); if (!reg.installing || Date.now() - t0 > 60000) return res(null); setTimeout(poll, 500); })();
        });
      });
    }).then(function (w) {
      if (!w) return reset('No update yet');
      btn.textContent = 'Updating…';
      navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
      w.postMessage('SKIP_WAITING');
      setTimeout(function () { location.reload(); }, 5000);
    }).catch(function () { reset('Couldn’t check'); });
  }
  function card(info, online) {
    var el = document.getElementById('booterr');
    if (!el) {
      el = document.createElement('div'); el.id = 'booterr';
      el.setAttribute('role', 'alertdialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'be-t'); el.setAttribute('aria-describedby', 'be-b');
      document.body.appendChild(el);
    }
    var u = unsent(), keep = ['your saved login'];
    if (u.n) keep.push(u.n + ' unsent cycle-count scan' + (u.n === 1 ? '' : 's'));
    if (u.fa) keep.push('your unsent F&A save');
    var safe = keep.length === 1 ? 'Your saved login is safe on this phone.'
      : 'Your saved login' + (keep.length === 3 ? ', ' + keep[1] + ' and ' + keep[2] : ' and ' + keep[1]) + ' are safe on this phone.';
    var body = info.phase === 'fetch'
      ? (online ? 'ToolBox couldn’t load its data. Check your connection and try again.'
                : 'ToolBox needs signal once more to finish saving its data on this phone. Try again when you’re connected.')
      : info.phase === 'stall'
      ? (online ? 'ToolBox is taking too long to open.' : 'ToolBox is taking too long to open, and you’re offline.')
      : (online ? 'Something in this version stopped ToolBox from opening. Checking for an update usually fixes it.'
                : 'Something in this version stopped ToolBox from opening. Try again — or check for an update when you have signal.');
    el.innerHTML = '<div class="be-card"><div class="be-ic" aria-hidden="true">!</div>' +
      '<div class="be-t" id="be-t">ToolBox didn’t open</div>' +
      '<div class="be-b" id="be-b"></div><div class="be-safe"></div>' +
      '<button type="button" class="be-btn" id="be-retry">Try again</button>' +
      (online ? '<button type="button" class="be-btn2" id="be-upd">Check for update</button>' : '') +
      '<div class="be-code"></div></div>';
    el.querySelector('.be-b').textContent = body;
    el.querySelector('.be-safe').textContent = safe;
    el.querySelector('.be-code').textContent = 'E-' + info.phase.toUpperCase() + ' · v' + appVer() + ' · ' + info.name + (info.msg ? ': ' + info.msg : '');
    el.querySelector('#be-retry').onclick = function () { location.reload(); };
    var ub = el.querySelector('#be-upd'); if (ub) ub.onclick = function () { update(ub); };
    el.hidden = false;
    try { el.querySelector('#be-retry').focus(); } catch (e) {}
  }
  window.TBX_FAIL = function (phase, e) {
    window.__tbxBooted = false;                 // a later retry may boot again
    window.__tbxBootPhase = 'failed';
    var info = { phase: phase, name: (e && e.name) || 'Error', msg: String((e && e.message) || e || '').slice(0, 140) };
    window.__tbxBootErr = info;
    try { document.documentElement.classList.add('tbx-failed'); } catch (x) {}
    try { window.dispatchEvent(new CustomEvent('tbx-boot-failed', { detail: info })); } catch (x) {}   // hook for start-up error reporting
    try { console.error('[ToolBox] start failed (' + phase + ')', e); } catch (x) {}
    function show() { window.TBX_PROBE(3000).then(function (on) { card(info, on); }); }
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  };
  window.addEventListener('load', function () {
    var t0 = Date.now();
    setTimeout(function check() {
      if (!document.documentElement.classList.contains('authed') || window.__tbxBootErr) return;
      var c = document.getElementById('content');
      if (c && c.innerHTML && c.innerHTML.length > 10) return;
      var ph = window.__tbxBootPhase;
      if (ph && ph !== 'booted' && ph !== 'failed' && Date.now() - t0 < 20000) return setTimeout(check, 1000);  // still starting on a slow phone: wait, don't wipe
      var again = false;
      try { again = !!sessionStorage.getItem('tbx_failsafe'); sessionStorage.setItem('tbx_failsafe', '1'); } catch (e) {}
      window.TBX_PROBE(4000).then(function (on) {
        if (!on || again) { window.TBX_FAIL('stall', new Error('blank after start (' + (ph || 'no phase') + ')')); return; }
        function go() { location.reload(); }
        try {
          caches.keys().then(function (ks) {
            return Promise.all(ks.filter(function (k) { return SHELL.test(k); }).map(function (k) { return caches.delete(k); }));
          }).then(go, go);
        } catch (e) { go(); }
      });
    }, 4000);
  });
})();
</script>
<script>
(function () {
  try {
    sessionStorage.removeItem('tbx_key'); localStorage.removeItem('tbx_key');
    if (sessionStorage.getItem('tbx_k2') || localStorage.getItem('tbx_k2')) {
      document.documentElement.classList.add('authed');
    }
  } catch (e) {}
})();
</script>
<script>
(function () {
  /* iOS 27 home-screen apps honour the phone's page-zoom setting (75%, 85%, …) but still report
     env(safe-area-inset-*) in unzoomed points, so at 75% the header covers only three quarters of the
     status bar. Measure the zoom and hand it to CSS as --z; every length that must stay put on screen —
     status-bar / home-indicator clearance and the header row — divides by it. Works for zoom-out and
     zoom-in alike. iPhone home-screen launches only; at 100% nothing is set and the CSS computes to
     exactly today's values. No iOS-version check: since iOS 26 the UA is frozen at "OS 18_7", and
     iOS ≤ 26 never zooms a web app, so the measured zoom itself is the gate.
     Diagnostics: tap the header title 5 times within 2 s to show the numbers behind this. */
  var SHELL = 'tbx-v372';
  var root = document.documentElement, ua = navigator.userAgent || '';
  var PRESETS = [0.5, 0.75, 0.85, 1, 1.15, 1.25, 1.5, 1.75, 2, 2.5, 3];
  function nearPreset(z) { for (var i = 0; i < PRESETS.length; i++) if (Math.abs(PRESETS[i] - z) < 0.02) return PRESETS[i]; return null; }
  function measure() {
    var w = window.innerWidth, h = window.innerHeight, sw = screen.width, sh = screen.height, dpr = window.devicePixelRatio || 1;
    var ref = w > h ? Math.max(sw, sh) : Math.min(sw, sh);           /* the screen edge innerWidth spans; innerWidth ignores the keyboard */
    var zs = (w > 0 && ref > 0) ? Math.round(ref / w * 1000) / 1000 : 1;
    var how = 'screen';
    if (Math.abs(zs - 1) < 0.005 && Math.abs(dpr - Math.round(dpr)) > 0.02) {
      /* screen size scaled along with the zoom (so the ratio hides it) but the pixel ratio did not: an iPhone at 100% is exactly 2× or 3× */
      var c3 = nearPreset(dpr / 3), c2 = nearPreset(dpr / 2);
      var zd = c3 !== null ? c3 : c2;
      if (zd !== null) { zs = zd; how = 'dpr'; }
    }
    var z = Math.min(3, Math.max(0.5, zs));
    if (!(z > 0)) z = 1;
    return { w: w, h: h, sw: sw, sh: sh, dpr: dpr, z: z, how: how };
  }
  var iphone = /iPhone/.test(ua);
  var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || (iphone && !/Safari\//.test(ua));
  var active = iphone && standalone;
  function apply() {
    if (!active) return;
    var m = measure();
    if (Math.abs(m.z - 1) < 0.005) root.style.removeProperty('--z'); else root.style.setProperty('--z', String(m.z));
  }
  try {
    apply();
    window.addEventListener('resize', apply);
    window.addEventListener('orientationchange', function () { setTimeout(apply, 80); });
    window.TBX_ZOOM = apply;
  } catch (e) {}
  try {
    document.addEventListener('DOMContentLoaded', function () {
      var t = document.getElementById('title'); if (!t) return;
      var taps = [];
      t.addEventListener('click', function () {
        var now = Date.now(); taps.push(now); taps = taps.filter(function (x) { return now - x < 2000; });
        if (taps.length < 5) return;
        taps = [];
        var old = document.getElementById('zdbg'); if (old) { old.remove(); return; }
        var m = measure(), cs = getComputedStyle(root), bar = document.getElementById('bar');
        var probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top, 0px);visibility:hidden;pointer-events:none';
        document.body.appendChild(probe); var inset = getComputedStyle(probe).height; probe.remove();
        var box = document.createElement('pre'); box.id = 'zdbg';
        box.style.cssText = 'position:fixed;left:8px;right:8px;top:38%;z-index:9999;margin:0;padding:12px 14px;border-radius:12px;background:rgba(20,20,20,.97);color:#F4F2EE;border:1px solid #6b5a2a;font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;box-shadow:0 10px 28px rgba(0,0,0,.5)';
        box.textContent = [
          'shell ' + SHELL + '   active ' + active + ' (iphone ' + iphone + ', standalone ' + standalone + ')',
          '--z ' + (cs.getPropertyValue('--z').trim() || '(unset = 1)') + '   measured ' + m.z + ' via ' + m.how,
          'inner ' + m.w + '×' + m.h + '   screen ' + m.sw + '×' + m.sh + '   dpr ' + m.dpr,
          'inset-top ' + inset + '   bar padding-top ' + (bar ? getComputedStyle(bar).paddingTop : '?'),
          'navigator.standalone ' + String(navigator.standalone) + '   display-mode standalone ' + (window.matchMedia ? matchMedia('(display-mode: standalone)').matches : '?'),
          'ua ' + ua,
          '(tap this box to close)'
        ].join('\n');
        box.addEventListener('click', function () { box.remove(); });
        document.body.appendChild(box);
      });
    });
  } catch (e) {}
})();
</script>

<style>
:root{
  --ink:#1E1E1E; --panel:#2A2A2A; --panel2:#242424; --line:#3A3A3A;
  --amber:#FDB515; --amber-press:#E5A30F; --green:#4CC97A;
  --bone:#F4F2EE; --muted:#9B968E; --dim:#CFCFCF; --danger:#F28B8B; --green-soft:#BFE9CC;
  --radius:12px;
  /* type scale: every size below is one of these six */
  --fs-xs:11px; --fs-sm:12.5px; --fs-md:14px; --fs-base:16px; --fs-lg:18px; --fs-xl:20px;
  /* page zoom compensation (see the head script): --z is 1 everywhere except zoomed iOS 27 home-screen launches.
     --sat/--sab replace env(safe-area-inset-top/bottom); the header's own padding and row height scale the same
     way so the title sits at the same spot on screen at any zoom. */
  --z:1;
  --sat:calc(env(safe-area-inset-top, 0px) / var(--z));
  --sab:calc(env(safe-area-inset-bottom, 0px) / var(--z));
  --hdr-pad:calc(10px / var(--z));
  --hdr-row:calc(56px / var(--z));
  /* P18 landscape: side safe areas, same zoom rule as --sat/--sab */
  --sal:calc(env(safe-area-inset-left, 0px) / var(--z));
  --sar:calc(env(safe-area-inset-right, 0px) / var(--z));
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--ink); color:var(--bone);
  font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
.mono{font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums;}
#bar{position:sticky; top:0; z-index:10; background:var(--ink);
  padding:calc(var(--sat) + var(--hdr-pad)) 14px 0; }
#bar .row{display:flex; align-items:center; gap:8px; min-height:var(--hdr-row);}
#bar .t{flex:1; text-align:center; font-size:clamp(15px, 4.6vw, 19px); font-weight:700; letter-spacing:.2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#bar .t em{font-style:normal; color:var(--amber);}
.t em.sup{font-size:.5em; font-weight:700; letter-spacing:.06em; text-transform:uppercase; vertical-align:super; line-height:0; margin-left:.15em;}
#bar::after{content:""; display:block; height:3px; background:var(--amber);
  margin:8px -14px 0; border-radius:0;}
.navbtn{width:52px; height:52px; border:1px solid var(--line); background:var(--panel);
  color:var(--bone); display:flex; align-items:center; justify-content:center; border-radius:14px;
  position:relative; transition:transform .08s ease; cursor:pointer;}
.navbtn::after{content:""; position:absolute; inset:-8px;}
.navbtn:active{background:var(--panel2); transform:scale(.94);}
.navbtn[hidden]{visibility:hidden; display:flex;}
.navbtn svg{display:block;}
#home svg{fill:none; stroke:var(--bone); transition:fill .18s, stroke .18s;}
#home.away{border-color:#6b5a2a;}
#home.away svg{fill:var(--amber); stroke:var(--amber);}
main{padding:16px 14px calc(var(--sab) + 28px); max-width:640px; margin:0 auto;}
.eyebrow{font-size:var(--fs-xs); font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); margin:22px 2px 8px;}
.search{display:flex; align-items:center; gap:10px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--radius); padding:0 14px; margin:4px 0 6px;}
.search svg{flex:none; opacity:.55}
.search input{flex:1; background:none; border:0; outline:0; color:var(--bone);
  font-size:17px; height:52px; caret-color:var(--amber);}
.search input::placeholder{color:var(--muted);}
.tiles{display:flex; flex-direction:column; gap:10px;}
.tile{background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; min-height:68px; display:flex; align-items:center; gap:14px;
  color:var(--bone); text-align:left; font:inherit; box-shadow:0 1px 2px rgba(0,0,0,.18);}
.tile .tl{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
.tile b{font-size:var(--fs-base); line-height:1.25; font-weight:650;}
.tile .n{color:var(--amber); font-size:var(--fs-sm); font-variant-numeric:tabular-nums; font-weight:700;}
.tile .ct{color:var(--muted); flex:none; font-size:20px; line-height:1;}
.tile:active{background:var(--panel2);}
.tile-inv{background:var(--amber); border-color:var(--amber); color:#141414;}
.tile-inv b{color:#141414;}
.tile-inv .n{color:rgba(20,20,20,.75);}
.tile-inv .ct{color:#141414;}
.tile-inv:active{background:var(--amber-press);}
/* backorder report: dark-blue home tile, status pills, card banner, report screen */
.tile-bo{background:#15304F; border-color:#2E5F96; color:#EAF3FF;}
.tile-bo b{color:#EAF3FF;}
.tile-bo .n{color:#9CC9FF;}
.tile-bo .ct{color:#9CC9FF;}
.tile-bo .tico{background:rgba(156,201,255,.12); border-color:rgba(156,201,255,.24);}
.tile-bo:active{background:#1C3F69;}
.bopill{display:inline-block; border:1px solid; border-radius:6px; padding:1px 7px; font-size:10.5px; font-weight:800; white-space:nowrap; letter-spacing:.35px; text-transform:uppercase; vertical-align:middle; line-height:1.5;}
.bopill.bo{background:#3A1516; color:#FFB3AE; border-color:#D06A68;}
.bopill.ctl{background:#3A2A14; color:#FFD98A; border-color:#8A6420;}
.bopill.clr{background:#143A22; color:#9BE3B4; border-color:#3E8A55;}
.card h1 .bopill{font-size:11px; margin-left:4px; position:relative; top:-2px;}
.bobanner{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:0 0 14px;}
.bobanner .bo-line{display:block; font-size:13.5px; font-weight:600; color:var(--bone); line-height:1.5;}
.bobanner .bo-line .bopill{margin-right:7px; position:relative; top:-1px;}
.bobanner .bo-w{display:inline;}
.bobanner .bo-line + .bo-line{margin-top:8px;}
.bobanner .bo-msg{color:#C9C5BE; font-size:13px; line-height:1.45; margin:6px 0 4px;}
.bo-asof{color:var(--muted); font-weight:500; white-space:nowrap;}
.bobanner .bo-more{display:block; margin-top:8px; border:0; background:none; color:var(--amber); font-weight:700; font-size:12.5px; padding:0; cursor:pointer; font-family:inherit;}
.bo-card{position:relative; padding:16px; margin-bottom:12px;}
.bo-head{display:flex; align-items:flex-start; gap:10px; padding-right:40px;}
.bo-title{font-size:var(--fs-md); font-weight:700; color:var(--bone);}
.bo-sub{margin:3px 0 0;}
.bo-rf{top:14px; right:14px; transition:opacity .15s;}
.bo-rf.spin{animation:bo-spin .8s linear infinite; opacity:.85;}
@keyframes bo-spin{to{transform:rotate(360deg);}}
.bo-chips{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 0; padding:2px 0 0;}
.bo-chips[hidden]{display:none;}
.bochip{flex:none; border:1.5px solid #5a564e; background:var(--panel); color:var(--bone); font:inherit; font-weight:700; font-size:12.5px; border-radius:999px; padding:7px 12px; cursor:pointer; white-space:nowrap; transition:transform .08s ease;}
.bochip:active{transform:scale(.94);}
.bochip.on{border-color:#9CC9FF; color:#0F1F33; background:#9CC9FF;}
.bo-card .cc-in{margin:12px 0 0;}
.bo-src{margin-top:10px; font-size:12.5px; line-height:1.45; color:var(--muted);}
.bo-hs{display:inline-block; margin-top:6px; padding:4px 0; color:var(--amber); font-weight:700; font-size:13.5px; text-decoration:underline; text-underline-offset:3px;}
.bo-hs:active{opacity:.7;}
.bo-gh{margin-top:18px;}
.bo-gh.bo{color:#FFB3AE;}
.bo-gh.ctl{color:#FFD98A;}
.bo-gh.clr{color:#9BE3B4;}
.bo-gh .bo-win{color:var(--muted); font-weight:600; letter-spacing:0; text-transform:none; font-size:12px;}
.bo-row .rl{min-width:0;}
.bo-row .bo-top{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:5px;}
.bo-row .bo-sku{color:var(--amber); font-size:12.5px; font-weight:600; letter-spacing:.2px;}
.bo-row .bo-nocat{color:var(--muted); font-size:11px; font-weight:600;}
.bo-row .rl b.ti{white-space:normal;}
.bo-row .rl span.bo-desc{white-space:normal; color:#B9B5AE;}
.bo-row .rl span.bo-meta{white-space:normal; color:var(--bone); font-weight:600; margin-top:4px;}
.bo-row .rl span.bo-asof{display:inline; margin:0; white-space:nowrap; font-size:inherit;}
.bo-row .bo-note{display:block; white-space:normal; color:#B9B5AE; font-size:12.5px; line-height:1.45; margin-top:5px; border-left:2px solid var(--line); padding-left:8px;}
.bo-nolink{cursor:default;}
.bo-nolink:active{background:var(--panel); transform:none;}
button.tile, .rowitem{cursor:pointer; width:100%;}
.list{display:flex; flex-direction:column; gap:8px;}
.rowitem{display:flex; align-items:center; gap:12px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px;
  color:var(--bone); text-align:left; font:inherit; min-height:56px;
  box-shadow:0 1px 2px rgba(0,0,0,.14);}
.pnL{flex:none; width:104px; color:var(--amber); font-size:12.5px; line-height:1.3; word-break:break-all;}
.rl .ti{color:var(--bone);}
.rl .sz{color:#7CCFE8; font-weight:700; font-size:13.5px;}
.rl .ld{display:block; color:#B9B5AE; font-size:var(--fs-sm); margin-top:2px; line-height:1.35;}

.uom{flex:none; color:var(--muted); font-size:11.5px; text-align:right; max-width:64px; line-height:1.3;}

.nobuild{background:#3A1516; border:1px dashed #D06A68; color:#FFB3AE; border-radius:10px; padding:10px 13px; font-size:13px; font-weight:700; margin:0 0 14px; letter-spacing:.5px; text-transform:uppercase;}
.sizehead{margin:12px 2px 6px; font-size:11.5px; font-weight:700; color:#7CCFE8;

.favbtn{border:1px solid var(--line); background:var(--panel2); color:var(--bone);

.favbtn.on{border-color:var(--amber); color:var(--amber);}
.favrow{margin:0 0 14px; display:flex; gap:8px; flex-wrap:wrap;}
/* share sheet */
#share-sheet, #ug-sheet, #ask-sheet{position:fixed; inset:0; z-index:92; background:rgba(0,0,0,.62); display:flex; align-items:flex-end;}
#share-sheet[hidden], #ug-sheet[hidden], #ask-sheet[hidden]{display:none;}
#share-sheet .as-card, #ug-sheet .as-card, #ask-sheet .as-card{width:100%; background:var(--panel); border-radius:20px 20px 0 0;
  padding:20px 20px calc(var(--sab) + 20px); border-top:1px solid var(--line);}
#share-sheet h3, #ug-sheet h3, #ask-sheet h3{margin:0 0 4px; font-size:17px;}
#ask-sheet .ask-b{color:var(--muted); font-size:14px; line-height:1.45; margin:6px 0 14px; white-space:pre-line;}
#ask-sheet .ask-row{display:flex; gap:10px;}
#ask-sheet .ask-row button{flex:1; min-height:46px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer; border:1px solid var(--line); background:var(--panel2); color:var(--bone);}
#ask-sheet .ask-row button.ok{background:var(--amber); border-color:var(--amber); color:#141414;}
#ask-sheet .ask-row button.danger{background:#5a2a29; border-color:#D06A68; color:#ffd9d8;}
#ask-sheet textarea{width:100%; min-height:120px; margin:0 0 12px; background:var(--panel2); color:var(--bone); border:1px solid var(--line); border-radius:12px; padding:10px; font:13px/1.4 ui-monospace, Menlo, monospace;}
#share-sheet .sh-sub{color:var(--muted); font-size:12.5px; margin-bottom:10px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;}
.shopt{display:flex; align-items:center; gap:14px; width:100%; background:none; border:0;
  border-top:1px solid var(--line); color:var(--bone); font-size:15.5px; font-weight:600;
  padding:14px 2px; text-align:left; cursor:pointer;}
.shopt:active{background:var(--panel2);}
.shopt .si{flex:none; width:38px; height:38px; border-radius:10px; background:rgba(253,181,21,.1);
  display:flex; align-items:center; justify-content:center;}
.shopt .sl{flex:1; min-width:0;}
.shopt .sl span{display:block; color:var(--muted); font-size:12px; font-weight:400; margin-top:1px;}
#share-sheet .as-close, #ug-sheet .as-close{width:100%; border:1px solid var(--line); background:var(--panel2); color:var(--bone);
  font-weight:700; font-size:15px; border-radius:12px; min-height:46px; cursor:pointer; margin-top:8px;}
.uomline{color:var(--muted); font-size:13px; margin:-6px 0 12px;}
.uomline b{color:var(--bone); font-weight:800; letter-spacing:.2px;}
.photo{display:block; width:auto; max-width:100%; border-radius:12px; border:1px solid var(--line); margin:14px auto 4px; background:#fff;} .photo-sm{width:auto; max-width:110px; max-height:150px;}
.linkrow{margin:12px 0 2px; display:flex; flex-wrap:wrap; gap:8px;}
.linkbtn{border:1px solid var(--line); background:var(--panel2); color:var(--amber); font-weight:700; font-size:13.5px; border-radius:999px; padding:9px 14px;}
.warn{background:#3A2A14; border:1px solid #8a6420; border-left:4px solid var(--amber); color:#FFD98A; border-radius:10px; padding:11px 13px; font-size:13.5px; font-weight:600; line-height:1.4; margin:0 0 14px;}
.rowitem .rl{flex:1; min-width:0;}
.rowitem .rl b{display:block; font-size:15px; font-weight:600; line-height:1.3;}
.rowitem .rl > .ld{display:block; color:var(--muted); font-size:12.5px; margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rowitem .pn{color:var(--amber); font-size:13px; flex:none;}
.rowitem .ct{color:var(--muted); flex:none; font-size:18px;}
.rowitem:active{background:var(--panel2);}
.grouphead{margin:20px 2px 8px; font-size:13px; font-weight:700; color:var(--amber);
  letter-spacing:.06em; text-transform:uppercase;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 16px;}
.card h1{margin:0 0 4px; font-size:var(--fs-xl); line-height:1.3; font-weight:700;}
.card .fam{color:var(--muted); font-size:13px; margin-bottom:14px;}
.pnblock{display:flex; align-items:center; gap:12px; background:var(--panel2);
  border:1px dashed var(--line); border-radius:12px; padding:12px 14px; margin:0 0 14px;}
.pnblock .num{flex:1; min-width:0; font-size:clamp(17px, 6vw, 24px); letter-spacing:.5px; color:var(--amber); white-space:nowrap;}
.copy{border:0; background:var(--amber); color:#141414; font-weight:700; font-size:14px;
  border-radius:999px; padding:10px 16px; min-height:44px;}
.copy:active{background:var(--amber-press);}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px;}
.chip{border:1px solid var(--amber); color:#FFFFFF; border-radius:999px;
  font-size:12.5px; font-weight:700; padding:5px 12px;}
.chip.dim{border-color:var(--line); color:var(--muted); font-weight:600;}
/* label kinds — each group reads as its own colour so they're tellable apart at a glance */
.chip.k-sub{border-color:#6E5AA6; color:#C3B4EC; background:rgba(110,90,166,.14); font-weight:700;}
.chip.k-grp{border-color:#4E8A5B; color:#9BD8A9; background:rgba(78,138,91,.14); font-weight:700;}
.ledger{border-top:1px solid var(--line);}
.ledger .lr{display:grid; grid-template-columns:minmax(0,42fr) minmax(0,58fr); gap:10px; padding:10px 2px;
  border-bottom:1px solid var(--line); font-size:14.5px;}
.ledger .lk{color:var(--muted);}
.ledger .lv{white-space:pre-line; color:var(--bone);}
.ledger .lv, .ledger .lk{overflow-wrap:anywhere;}
.ledger .lhead{margin:16px 2px 4px; padding-bottom:5px; font-size:11.5px; font-weight:700; color:#7CCFE8;
  letter-spacing:.1em; text-transform:uppercase; opacity:.9; border-bottom:1px solid var(--line);}
.reflinkrow{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px;}
.refbtn{border:1.5px solid var(--amber); background:rgba(253,181,21,.08); color:var(--amber);
  font-family:inherit; font-weight:700; font-size:13.5px; line-height:1.25; letter-spacing:.1px; border-radius:10px;
  min-height:40px; padding:8px 14px; display:inline-flex; align-items:center; gap:6px; text-align:left; cursor:pointer;}
.refbtn::after{content:"\203A"; font-size:17px; line-height:1;}
.refbtn:active{background:rgba(253,181,21,.18);}
.note{margin-top:14px; font-size:13.5px; color:var(--bone); background:var(--panel2);
  border-left:3px solid var(--amber); border-radius:0 10px 10px 0; padding:10px 12px;}
.src{margin-top:12px; font-size:11.5px; color:var(--muted); line-height:1.5;}
.empty{color:var(--muted); text-align:center; padding:34px 10px; font-size:14.5px;}
.foot{margin-top:30px; text-align:center; color:var(--muted); font-size:11.5px; line-height:1.7;}
#toast{position:fixed; left:50%; bottom:calc(var(--sab) + 24px);
  transform:translateX(-50%) translateY(20px); background:var(--amber); color:#141414;
  font-weight:700; font-size:14px; border-radius:999px; padding:10px 18px; opacity:0;
  pointer-events:none; transition:opacity .18s, transform .18s;}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
#toast.act{pointer-events:auto; padding-right:8px; display:flex; align-items:center; gap:12px; white-space:nowrap;}
#toast button{border:0; background:rgba(20,20,20,.16); color:#141414; font:inherit; font-weight:800; border-radius:999px; padding:6px 12px; cursor:pointer;}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ #toast{transition:none;} }
main{padding-bottom:calc(var(--sab) + 96px);}
#bottombar{position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(var(--sab) + 10px);
  background:rgba(30,30,30,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); z-index:30;}
#toast{bottom:calc(var(--sab) + 120px);}
#updbanner{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--sab) + 78px); z-index:40;
  background:var(--amber); color:#1E1E1E; font-weight:800; font-size:14px;
  border:none; border-radius:999px; padding:12px 18px; box-shadow:0 6px 24px rgba(0,0,0,.5);}
/* P18: the update banner spans the screen (inside the side insets) instead of a half-width pill that wrapped under the bubble */
body:not(.ct-chrome-off) #updbanner{left:max(14px, var(--sal, 0px)); right:max(14px, var(--sar, 0px)); transform:none; max-width:420px; margin:0 auto; text-align:center;}
.chip.link{border-color:#B7B1A8; color:#FFFFFF; background:#3E3E3E; font-weight:700;}
.vhead{margin-top:2px;}
.fchips{display:flex; flex-wrap:wrap; gap:8px; margin:2px 2px 12px;}
.schips{display:flex; gap:8px; margin:6px 0 2px; overflow-x:auto; padding:2px 2px 6px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.schips::-webkit-scrollbar{display:none;}
.schip{flex:none; border:1.5px solid #5a564e; background:var(--panel); color:var(--bone);
  font-weight:700; font-size:12.5px; border-radius:999px; padding:8px 13px; cursor:pointer;
  white-space:nowrap; transition:transform .08s ease;}
.schip:active{transform:scale(.94);}
.schip.sort{margin-left:auto; border-style:dashed;}
.schip.sort.on{border-style:solid;}
.showall{display:block; width:100%; margin:8px 0 14px; min-height:44px; border:1px solid var(--line); background:var(--panel); color:var(--amber); font-weight:700; font-size:14px; border-radius:12px; cursor:pointer;}
.schip.on{border-color:var(--amber); color:#1E1E1E; background:var(--amber);}
.sfrow{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:4px 2px 2px;}
.sfsel{position:relative; display:inline-flex; align-items:center; gap:6px; border:1.5px solid #5a564e; background:var(--panel);
  color:var(--bone); border-radius:999px; padding:0 26px 0 12px; min-height:36px; font-size:12.5px; cursor:pointer;}
.sfsel .sfk{color:var(--muted); font-weight:600; white-space:nowrap;}
.sfsel select{appearance:none; -webkit-appearance:none; background:transparent; border:0; color:inherit; font:inherit; font-weight:700;
  padding:8px 0; max-width:10.5em; text-overflow:ellipsis; cursor:pointer; outline-offset:2px;}
.sfsel select option{color:#1E1E1E; background:#FFFFFF;}
.sfsel::after{content:'\25BE'; position:absolute; right:11px; top:50%; transform:translateY(-50%); pointer-events:none; font-size:11px; color:var(--muted);}
.sfsel.on{border-color:var(--amber);}
.sfsel.on .sfk, .sfsel.on::after{color:var(--amber);}
.sfcount{font-size:12px; color:var(--muted);}
.sfclear{border:0; background:none; color:var(--amber); font-weight:700; font-size:12.5px; text-decoration:underline; padding:8px 4px; cursor:pointer;}
.fchip{border:1.5px solid #A8A29A; background:#3E3E3E; color:#FFFFFF;
  font-weight:700; font-size:12.5px; border-radius:999px; padding:8px 13px;}
.fchip.on{border-color:var(--amber); color:#1E1E1E; background:var(--amber);}
.gterm{background:none; border:none; padding:0; font:inherit; color:inherit;
  border-bottom:1px dotted var(--amber); cursor:pointer;}
.gnb{white-space:nowrap;}
#glosspanel{position:fixed; left:12px; right:12px; bottom:calc(var(--sab) + 76px);
  z-index:45; background:#2E2C28; border:1px solid #6b5a2a; border-left:4px solid var(--amber);
  border-radius:12px; padding:13px 15px; color:var(--bone); font-size:14px; line-height:1.5;
  box-shadow:0 10px 30px rgba(0,0,0,.55);}
#glosspanel b{color:var(--amber); display:block; margin-bottom:3px;}
.bp{margin:14px 2px; background:#1E2B22; border:1px solid #2F5C3E; border-left:4px solid var(--green);
  border-radius:12px; padding:13px 15px;}
.bp-h{color:var(--green); font-weight:800; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px;}
.bp-b{color:var(--bone); font-size:15px; line-height:1.55; white-space:pre-line; font-weight:600;}


/* feedback */
#fb-fab{position:fixed; right:14px; bottom:calc(78px + var(--sab)); z-index:60;
  width:46px; height:46px; border-radius:50%; border:1px solid #56524A; background:rgba(42,42,42,.94);
  color:var(--amber); font-size:20px; line-height:1; box-shadow:0 4px 14px rgba(0,0,0,.5);}
#fb-fab:active{background:#333;}
/* P12: fades out while the page moves (.15s), back in after 600 ms still (.25s); taps pass through while it is away */
#fb-fab{transition:opacity .25s ease-in-out;}
#fb-fab.fb-away{opacity:0; pointer-events:none; transition:opacity .15s ease-out;}
body.gloss-on #fb-fab, body.upd-on #fb-fab, body.kb-on #fb-fab{opacity:0; pointer-events:none;}
/* P12: the last content on catalog screens scrolls clear of the bubble (bar 72 + gap 6 + bubble 46 + 8) */
body:not(.ct-chrome-off) #content:not(.homeview)::after{content:""; display:block; height:36px;}
/* CT Team screens are purely functional: no feedback bubble */
body.ct-chrome-off #fb-fab{display:none;}
#fb-ov{position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.62);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center; padding:12vh 18px 18px;}
#fb-ov[hidden]{display:none;}
#fb-card{width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px;}
#fb-t{font-weight:800; font-size:17px; margin-bottom:5px;}
#fb-ctx{color:var(--muted); font-size:12.5px; margin-bottom:12px; word-break:break-word;}
#fb-card input,#fb-card textarea{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  color:var(--bone); padding:11px 12px; font-size:16px; margin-bottom:10px; font-family:inherit;}
#fb-card textarea{resize:vertical; min-height:110px;}
#fb-row{display:flex; gap:10px; justify-content:flex-end;}
#fb-row button{border-radius:10px; padding:10px 16px; font-size:15px; font-weight:700; border:1px solid var(--line);}
#fb-cancel{background:var(--panel2); color:var(--bone);}
#fb-send{background:var(--amber); color:#1E1E1E; border-color:var(--amber);}
#fb-hint{color:var(--muted); font-size:12px; margin-top:10px;}
#fb-shotrow{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
#fb-shot{height:72px; max-width:44%; object-fit:cover; border:1px solid var(--line); border-radius:8px; display:none;}
#fb-shotcap{color:var(--muted); font-size:12.5px;}

/* password gate */
#lock{position:fixed; inset:0; z-index:100; background:var(--ink); display:flex;
  align-items:center; justify-content:center;
  padding:calc(var(--sat) + 24px) 20px calc(var(--sab) + 24px);}
html.authed #lock{opacity:0; visibility:hidden; pointer-events:none; transition:opacity .22s, visibility .22s;}
#lock .lk-card{width:100%; max-width:340px; text-align:center;}
#lock .lk-badge{width:56px; height:56px; margin:0 auto 18px; border-radius:16px; background:var(--panel);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
#lock .lk-title{font-size:22px; font-weight:700; letter-spacing:.2px;}
#lock .lk-title em{font-style:normal; color:var(--amber);}
#lock .lk-sub{color:var(--muted); font-size:14px; margin:6px 0 22px;}
#lock .lk-field{display:flex; align-items:center; gap:8px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--radius); padding:0 6px 0 14px; text-align:left;}
#lock .lk-field:focus-within{border-color:var(--amber);}
#lock .lk-field input{flex:1; background:none; border:0; outline:0; color:var(--bone);
  font-size:17px; height:52px; caret-color:var(--amber); min-width:0;}
#lock .lk-field input::placeholder{color:var(--muted);}
#lock .lk-show{border:0; background:none; color:var(--muted); font-weight:700; font-size:13px;
  padding:10px 12px; min-height:44px;}
#lock .lk-err{color:#FFB3AE; font-size:13.5px; font-weight:600; margin:10px 2px 0; min-height:18px;}
#lock .lk-btn{width:100%; border:0; background:var(--amber); color:#141414; font-weight:700;
  font-size:16px; border-radius:var(--radius); padding:14px 16px; min-height:50px; margin-top:14px;}
#lock .lk-btn:active{background:var(--amber-press);}
#lock .lk-foot{color:var(--muted); font-size:11.5px; margin-top:18px; line-height:1.6;}
#lock .lk-remember{display:flex; align-items:center; justify-content:center; gap:9px;
  color:var(--muted); font-size:13.5px; font-weight:600; margin-top:16px; cursor:pointer;
  -webkit-user-select:none; user-select:none;}
#lock .lk-remember input{width:18px; height:18px; accent-color:var(--amber); margin:0;}
#lock.shake .lk-card{animation:lkshake .3s;}
@keyframes lkshake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)}}
#lock .lk-shackle{transform-origin:16px 9px; transition:transform .5s cubic-bezier(.34,1.56,.64,1);}
#lock.open .lk-shackle{transform:translateY(-2.5px) rotate(-35deg);}
#lock .lk-badge svg rect, #lock .lk-badge svg path{transition:stroke .35s;}
#lock .lk-badge svg circle{transition:fill .35s;}
#lock.open .lk-badge svg rect, #lock.open .lk-badge svg path{stroke:var(--green);}
#lock.open .lk-badge svg circle{fill:var(--green);}
#lock.open .lk-badge{animation:lkpop .55s cubic-bezier(.34,1.56,.64,1);}
@keyframes lkpop{0%{transform:scale(1)} 45%{transform:scale(1.12)} 100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){ #lock.shake .lk-card{animation:none;} html.authed #lock{transition:none;}
  #lock .lk-shackle{transition:none;} #lock.open .lk-badge{animation:none;} }

/* gate hardening: app stays unrendered AND hidden until unlocked */
html:not(.authed) #bar, html:not(.authed) main, html:not(.authed) #bottombar,
html:not(.authed) #fb-fab, html:not(.authed) #updbanner { display: none !important; }

/* view transitions + touch feedback */
#content.vt{animation:vtin .18s ease;}
@keyframes vtin{from{opacity:0; transform:translateY(7px);} to{opacity:1; transform:none;}}
.tile, .rowitem, .favbtn, .copy, .linkbtn, .fchip{transition:transform .08s ease;}
.tile:active, .rowitem:active{transform:scale(.975);}
.copy:active, .favbtn:active, .linkbtn:active, .fchip:active{transform:scale(.94);}
@media (prefers-reduced-motion: reduce){ #content.vt{animation:none;}
  .tile:active,.rowitem:active,.copy:active,.favbtn:active,.linkbtn:active,.fchip:active{transform:none;} }

/* tile icons */
.tile .tico{flex:none; width:44px; height:44px; border-radius:12px; display:flex;
  align-items:center; justify-content:center; background:rgba(253,181,21,.10);
  border:1px solid rgba(253,181,21,.16);}
.tile .tico svg{display:block; width:24px; height:24px;}
.tile:focus-visible, .rowitem:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

/* home favorites/recents action buttons */
.rowwrap{display:flex; align-items:center; gap:8px; transition:opacity .28s, transform .28s;}
.rowwrap .rowitem{flex:1; min-width:0;}
.rowwrap.bye{opacity:0; transform:translateX(14px);}
.rwact{flex:none; width:42px; height:42px; border:1px solid var(--line); background:var(--panel);
  color:var(--amber); font-size:19px; border-radius:12px; display:flex; align-items:center;
  justify-content:center; cursor:pointer; padding:0; transition:transform .08s ease, color .15s;}
.rwact:active{transform:scale(.92); background:var(--panel2);}
.rwact.off{color:var(--muted);}
.rwact.rwx{color:var(--muted); font-size:14px;}

/* home fills the screen: tiles grow to share the free space */
#content.homeview{display:flex; flex-direction:column;
  min-height:calc(100dvh - 107px - var(--sat) - var(--sab) - var(--hdr-pad) - var(--hdr-row));}
@supports not (height:100dvh){ #content.homeview{min-height:calc(100vh - 107px - var(--sat) - var(--sab) - var(--hdr-pad) - var(--hdr-row));} }
#content.homeview .tiles{flex:1; gap:8px;}
#content.homeview .tile{flex:1; min-height:52px; max-height:88px; padding:10px 14px;}
#content.homeview .tile b{font-size:var(--fs-base);}
#content.homeview .tile .n{font-size:var(--fs-sm);}
#content.homeview .tico{width:38px; height:38px; border-radius:11px;}
#content.homeview .tico svg{width:22px; height:22px;}
#content.homeview .eyebrow{margin-top:12px;}
.ebrow{display:flex; align-items:baseline; justify-content:space-between;}
.clearrec{background:none; border:0; color:var(--muted); font-weight:700; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:2px 0 2px 12px; cursor:pointer;}
.clearrec:active{color:var(--bone);}
.about-quote{margin:14px 18px 4px; text-align:center; color:#fff; font-style:italic; font-size:12.5px; line-height:1.6; opacity:.85;}
.about-card{padding:12px 16px;}
.about-card .about-logo{width:58px; height:58px; margin:0 auto 6px;}
.about-card .tip{padding:8px 0; font-size:13.5px; line-height:1.48;}
.ab-gh{margin:12px 2px 6px;}
/* P2: the "Offline photos" line on About. P34: a card photo that really failed to load (cardPhotos in the bundle) */
.ab-photos{margin-top:3px; color:var(--muted); font-size:12.5px; line-height:1.4;}
.ab-ph-go{border:0; background:none; color:var(--amber); font:inherit; font-weight:700; padding:7px 8px; cursor:pointer;}
img.ph-failed{display:none;}
.ph-miss{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; width:100%; min-height:140px;
  margin:14px auto 4px; padding:14px 12px; border:1px dashed var(--line); border-radius:12px; background:var(--panel2);
  color:var(--muted); font:inherit; font-size:13px; text-align:center; cursor:pointer;}
.ph-miss b{color:#CFCBC4; font-weight:700;}
.ph-miss em{font-style:normal; color:var(--amber); font-size:12.5px; font-weight:700;}
.ph-miss:active{background:var(--panel);}
/* cycle count */
.cc-card{max-width:420px; margin:14px auto; text-align:center; padding:20px 16px;}
.cc-h{margin:0 0 6px; font-size:var(--fs-xl);}
.cc-sub{color:var(--muted); font-size:var(--fs-sm); margin-bottom:12px;}
.cc-sub2{color:var(--muted); font-size:var(--fs-xs); margin-top:10px;}
.cc-in{display:block; width:100%; box-sizing:border-box; margin:8px 0; padding:12px; border-radius:12px;
  border:1px solid var(--line); background:#141414; color:var(--bone); font-size:16px;} /* 16px+: iOS won't zoom on focus */
.cc-btn{display:inline-block; margin-top:10px; padding:12px 22px; border-radius:999px; border:0;
  background:var(--amber); color:#141414; font-weight:800; font-size:15px; cursor:pointer;}
.cc-btn:disabled{opacity:.6;}
.cc-err{color:#FF8A85; font-size:13px; margin:4px 0;}
#ccwrap{display:flex; flex-direction:column; margin:-4px -2px 0;}
#cctop{position:relative; background:#000; border-radius:16px; overflow:hidden;
  height:34vh; height:34dvh; min-height:207px;}
#ccvid{width:100%; height:100%; object-fit:cover;}
#cctop.cc-pinned{position:sticky; z-index:5; margin-bottom:10px;}
#cctop.cc-pinned #ccbar .cc-mini{margin-top:0;}
.cc-stat{position:absolute; left:0; right:0; top:8px; text-align:center; color:#fff; font-size:12.5px;
  text-shadow:0 1px 3px rgba(0,0,0,.8); padding:0 52px 0 88px;}
.cc-torch{position:absolute; right:10px; top:6px; border:0; background:rgba(0,0,0,.45); color:#fff;
  border-radius:999px; width:36px; height:36px; font-size:16px;}
.cc-torch.on{background:var(--amber); color:#141414;}
#ccbar{position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:8px;
  padding:8px 10px; background:linear-gradient(transparent, rgba(0,0,0,.72));}
.cc-toggle{display:flex; border:1px solid rgba(255,255,255,.5); border-radius:999px; overflow:hidden;}
.cc-toggle button{border:0; background:transparent; color:#fff; padding:7px 12px; font-size:12.5px; font-weight:700;}
.cc-toggle button.on{background:var(--amber); color:#141414;}
.cc-mini{border:1px solid rgba(255,255,255,.5); background:rgba(0,0,0,.35); color:#fff; border-radius:999px;
  padding:7px 12px; font-size:12.5px; font-weight:700;}
.cc-endb{border-color:#D06A68; color:#FFC9C5;}
.cc-endtop{position:absolute; left:10px; top:6px; z-index:6; border:1px solid #D06A68;
  background:rgba(0,0,0,.5); color:#FFC9C5; border-radius:999px;
  padding:9px 17px; font-size:14px; font-weight:800; line-height:1;}
.cc-endtop:active{background:#D06A68; color:#fff;}
.cc-mini.camoff{background:var(--amber); border-color:var(--amber); color:#141414;}
#cchead{display:flex; justify-content:space-between; align-items:baseline; margin:10px 4px 6px;
  color:var(--amber); font-weight:800; font-size:14px;}
#cc-tot{color:var(--muted); font-weight:600; font-size:12px;}
.cc-pill{font-size:var(--fs-xs); font-weight:700; font-variant-numeric:tabular-nums; padding:3px 9px; border-radius:999px; background:#2a3340; color:var(--muted); white-space:nowrap;}
.cc-pill.ok{background:rgba(46,164,120,.18); color:#5fd6a4;}
.cc-pill.busy{background:rgba(90,150,220,.18); color:#8fb9ea;}
.cc-pill.wait{background:rgba(224,164,49,.18); color:var(--amber);}
select.cc-sel{-webkit-appearance:none; appearance:none;}
.cc-link{background:none; border:0; padding:0 2px; color:#8fb9ea; font-size:12px; text-decoration:underline; cursor:pointer;}
#cclist{padding-bottom:90px;}
/* Scanning: camera + totals stay put, only the scanned list scrolls.
   Header is safe-area + 10px padding + 56px row + 3px rule = 69px. */
body.cc-fixed{overflow:hidden;}
body.cc-fixed main{padding-bottom:0; display:flex; flex-direction:column; overflow:hidden;
  height:calc(100vh - var(--sat) - var(--hdr-pad) - var(--hdr-row) - 3px);
  height:calc(100dvh - var(--sat) - var(--hdr-pad) - var(--hdr-row) - 3px);}
body.cc-fixed #content{flex:1; min-height:0; display:flex; flex-direction:column;}
body.cc-fixed #ccwrap{flex:1; min-height:0;}
body.cc-fixed #cctop, body.cc-fixed #cchead{flex:0 0 auto;}
body.cc-fixed #cclist{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--sab) + 12px);}
.cc-empty{color:var(--muted); text-align:center; font-size:var(--fs-sm); padding:22px 10px;}
.ccrow{display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:14px;
  border:1px solid var(--line); background:var(--panel); margin-bottom:8px;}
.ccrow.pend{opacity:.65;}
.ccrow.flash{outline:2px solid var(--amber);}
.ccr-main{flex:1; min-width:0;}
.ccr-ref{font-weight:800; font-size:15px; letter-spacing:.2px;}
.ccr-sub{color:var(--bone); font-size:12.5px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ccr-sub2{color:var(--muted); font-size:11.5px; margin-top:1px;}
.ccr-qty{font-variant-numeric:tabular-nums; min-width:44px; text-align:center; background:var(--amber); color:#141414; font-weight:900;
  border-radius:12px; padding:8px 6px; font-size:16px;}
#cc-sheet{position:fixed; left:10px; right:10px; bottom:calc(var(--sab) + 78px); z-index:75;
  background:#1E1E1E; border:1px solid var(--line); border-radius:18px; padding:14px 14px 16px; text-align:center;
  box-shadow:0 12px 34px rgba(0,0,0,.55);}
.cc-sh-h{font-weight:800; font-size:15px; margin-bottom:4px;}
.cc-sh-row{display:flex; gap:10px; justify-content:center; align-items:center; margin-top:10px;}
.cc-qtyrow{display:flex; gap:12px; justify-content:center; align-items:center; margin-top:10px;}
.cc-qbtn{width:52px; height:52px; border-radius:16px; border:1px solid var(--line); background:#141414;
  color:var(--bone); font-size:24px; font-weight:800;}
.cc-qin{width:84px; text-align:center; font-size:24px; font-weight:900; padding:10px 4px; border-radius:14px;
  border:1px solid var(--line); background:#141414; color:var(--amber);}
/* CT team hub + count cards */
.ct-big{display:block; width:100%; margin-top:12px; padding:15px 16px; border-radius:14px; border:1px solid var(--line);
  background:rgba(255,255,255,.04); color:var(--bone); font:inherit; font-size:16.5px; font-weight:800; text-align:left;}
.ct-big span{display:block; margin-top:3px; font-weight:400; font-size:12.5px; color:var(--muted);}
.ct-soon{opacity:.5; pointer-events:none;}
.cc-pill.bad{background:rgba(208,106,104,.18); color:#FFB3AE;}
.fa2-em{color:var(--amber); font-style:normal; font-size:.5em; font-weight:700; letter-spacing:.06em; text-transform:uppercase; vertical-align:super; line-height:0; margin-left:.15em;}
.fa2-pills{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:4px 0 6px; min-height:24px;}
.fa2-row{display:flex; justify-content:space-between; align-items:center; gap:10px; text-align:left; border:1px solid var(--line); background:#242424; border-radius:12px; padding:10px 12px; margin-top:8px;}
.fa2-t{font-weight:700; font-size:14.5px;}
.fa2-s{color:var(--muted); font-size:12px; margin-top:2px;}
.fa2-lot{color:var(--muted); font-weight:400; font-size:12px;}
.fa2-r{display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
.fa2-r b{font-size:15px;}
/* F&A v2 — full-width like the catalog (no outer panel), highlighted section bands, visible refresh */
.cc-card{position:relative;}
.cc-in[hidden], .cc-in[hidden=""]{display:none;}
.fa2-flash{display:flex; align-items:center; gap:9px; margin:0 52px 12px 0; padding:11px 12px; border-radius:12px; font-size:13.5px; font-weight:700; border:1px solid transparent;}
.fa2-flash[hidden]{display:none;}
.fa2-flash.busy{background:rgba(90,150,220,.16); border-color:rgba(90,150,220,.45); color:#9db8ff;}
.fa2-flash.ok{background:rgba(90,200,120,.18); border-color:rgba(90,200,120,.5); color:#7ed99b;}
.fa2-flash.bad{background:rgba(240,90,90,.18); border-color:rgba(240,90,90,.5); color:#f28b8b;}
.fa2-fl-dot{width:10px; height:10px; border-radius:50%; background:currentColor; flex:0 0 auto;}
.fa2-flash.busy .fa2-fl-dot{animation:fa2pulse 1s ease-in-out infinite;}
@keyframes fa2pulse{0%,100%{opacity:.2} 50%{opacity:1}}
.fa2-flash .fa2-fl-act{margin-left:auto; color:inherit; font-weight:800;}
body.fa2-wide #content > .card.cc-card{max-width:none; margin:0; padding:0; background:transparent; border:0; text-align:left;}
body.fa2-wide .cc-h{text-align:left; margin:2px 0 4px;}
body.fa2-wide .cc-sub{text-align:left;}
body.fa2-wide .cc-rfb{top:-4px; right:0;}
body.fa2-wide .fa2-pills{justify-content:flex-start;}
body.fa2-wide .cc-btn{display:block; width:100%; box-sizing:border-box; text-align:center;}
body.fa2-wide .fa2-mrow .cc-btn, body.fa2-wide .pk-qty .cc-btn{display:inline-block; width:auto;}
body.fa2-wide .cc-empty{text-align:left; padding:14px 2px;}
body.fa2-wide .cc-mini{margin-top:8px;}
.fa2-eyebrow{display:block; margin:14px 0 6px; padding:7px 12px; border-radius:10px; background:rgba(255,255,255,.06); color:var(--bone); font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; text-align:left;}
.fa2-eyebrow.bad{background:rgba(240,90,90,.22); color:#f28b8b;}
.fa2-eyebrow.warn{background:rgba(240,180,60,.22); color:#f0c060;}
.fa2-eyebrow.ok{background:rgba(90,200,120,.2); color:#7ed99b;}
.fa2-eyebrow.soon{background:rgba(90,150,220,.2); color:#8fb9ea;}
.fa2-pills button.cc-pill{border:0; font:inherit; font-size:11px; font-weight:700; cursor:pointer; line-height:inherit;}
.fa2-resume{margin:0 0 10px; padding:9px 12px; border-radius:12px; background:rgba(224,164,49,.14); border:1px solid rgba(224,164,49,.4); color:var(--bone);}
.fa2-resume .cc-link{margin-left:6px;}
.fa2-fl-dis{margin-left:8px; opacity:.75; color:inherit; font-weight:700;}
.fa2-amt{display:block; font-size:15px; font-weight:800; color:var(--amber); white-space:nowrap; text-align:right;}
.fa2-who{color:var(--bone); font-weight:600; font-size:13px;}

.ct-big:active{background:rgba(255,255,255,.08);}
.ct-gold{background:var(--amber); border-color:var(--amber); color:#141414; font-weight:800;}
.ct-gold span{color:rgba(20,20,20,.75); font-weight:600;}
.ct-gold:active{background:var(--amber-press);}
.ct-help{position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:999px;
  border:2px solid var(--amber); background:transparent; color:var(--amber); font-weight:800; font-size:16px; line-height:1; cursor:pointer;}
.ct-help:active{background:rgba(253,181,21,.15);}
#annov{position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; padding:24px;}
.ann-card{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:16px; max-width:360px; width:100%; padding:22px 20px 20px; box-shadow:0 12px 40px rgba(0,0,0,.5);}
.ann-t{font-weight:800; font-size:19px; margin-bottom:10px; color:var(--bone);}
.ann-b{color:var(--bone); font-size:14.5px; line-height:1.55;}
.ann-link{background:none; border:0; padding:0; color:var(--amber); font:inherit; font-weight:800; text-decoration:underline; cursor:pointer;}
#ann-x{position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:999px; border:1px solid var(--line); background:var(--panel2); color:var(--bone); font-size:14px; line-height:1; cursor:pointer;}
.wn-link{color:var(--amber); font-weight:800; text-decoration:underline;}
.cc-lab{display:block; text-align:left; margin:10px 2px 0; font-size:11px; color:var(--muted); letter-spacing:.07em; text-transform:uppercase;}
.ctc-wrap{margin-top:14px; text-align:left;}
.ctc{display:flex; align-items:center; gap:10px; padding:11px 12px; margin-top:8px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.03);}
.ctc:active{background:rgba(255,255,255,.07);}
.ctc-main{flex:1; min-width:0;}
.ctc-t{font-weight:800; font-size:14.5px;}
.ctc-l{margin-top:2px; font-size:13px;}
.ctc-n{margin-top:2px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ctc-r{text-align:right; font-size:var(--fs-sm); font-variant-numeric:tabular-nums; color:var(--amber); font-weight:700; line-height:1.35; white-space:nowrap;}

/* home refresh + sync status */
.cc-home{position:relative;}
.cc-rfb{position:absolute; top:10px; right:10px; width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  background:rgba(255,255,255,.05); color:var(--amber); font-size:19px; line-height:1; cursor:pointer; padding:0;}
.cc-rfb:disabled{opacity:.55;}
.cc-rfb.ok{color:#7ed99b; border-color:rgba(90,200,120,.6);}
.cc-rfb.spin{animation:ccspin .8s linear infinite;}
@keyframes ccspin{to{transform:rotate(360deg);}}
.cc-sync{margin-top:8px; font-size:var(--fs-xs); font-variant-numeric:tabular-nums; color:var(--muted); min-height:15px;}
/* iOS renders datetime-local with its own centered pill; normalize it to match .cc-in */
input[type="date"].cc-in, input[type="datetime-local"].cc-in{-webkit-appearance:none; appearance:none; display:block; width:100%;
  box-sizing:border-box; min-height:47px; text-align:left;}
input[type="datetime-local"].cc-in::-webkit-date-and-time-value{text-align:left; margin:0;}

/* cycle-count scan confirm: centered modal */
#cc-backdrop{position:fixed; inset:0; z-index:74; background:rgba(8,8,8,.72);}
#cc-sheet.cc-modal{left:50%; right:auto; top:50%; bottom:auto; transform:translate(-50%,-50%);
  width:min(430px, calc(100vw - 32px)); padding:24px 22px 22px; border-radius:24px; z-index:76;
  box-shadow:0 22px 66px rgba(0,0,0,.6);}
.cc-modal .cc-sh-h{font-size:19px; margin-bottom:6px;}
.cc-modal .cc-sub{font-size:14px; margin-bottom:0;}
.cc-modal .cc-qlabel{color:var(--muted); font-size:11.5px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; margin:18px 0 0;}
.cc-modal .cc-qtyrow{gap:16px; margin-top:8px;}
.cc-modal .cc-qbtn{width:60px; height:60px; font-size:28px;}
.cc-modal .cc-qin{width:98px; font-size:30px;}
.cc-modal .cc-sh-row{gap:14px; margin-top:24px;}
.cc-modal .cc-sh-row button{flex:1; margin-top:0; padding:17px 0; font-size:17px; border-radius:999px;}
.cc-cancel{border:1px solid rgba(255,255,255,.34); background:rgba(255,255,255,.05); color:var(--bone);
  font-weight:800; cursor:pointer;}
/* Field Ops count sheet (cycle count) */
.fops-wrap{margin-top:18px; text-align:left;}
.fops-wrap.fops-top{margin:4px 0 18px;}
#cc-counts-lab{text-align:left; margin-top:4px;}
.fops-lab{font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:0 2px 6px; border-bottom:1px solid var(--line); margin-bottom:8px;}
.fops-home{display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px dashed var(--amber); border-radius:12px; background:rgba(253,181,21,.07); cursor:pointer;}
.fops-home:active{background:rgba(253,181,21,.14);}
.fops-ic{font-size:22px; line-height:1; flex:0 0 auto;}
.fops-chev{color:var(--muted); font-size:22px; line-height:1; flex:0 0 auto;}
.fops-t{font-weight:800; font-size:14.5px;}
.fops-sub{color:var(--muted); font-size:var(--fs-sm); margin-top:4px; line-height:1.4;}
.fops-sub b{color:var(--bone);}
.fops-dim{color:var(--muted);}
.fops-bar{height:6px; border-radius:999px; background:#2a3340; margin:10px 0 6px; overflow:hidden;}
.fops-fill{height:100%; background:var(--green); border-radius:999px; transition:width .3s;}
.fops-nums{display:flex; gap:12px; font-size:var(--fs-sm); font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px;}
.fops-nums .ok{color:#5fd6a4;} .fops-nums .miss{color:var(--amber);} .fops-nums .add{color:#8fb9ea;}
.fops-row{display:flex; gap:16px; align-items:center; margin-top:8px; flex-wrap:wrap;}
.fops-row-links{margin-top:6px; gap:22px;}
.fops-dl-wrap{text-align:center; margin:2px 0 10px;}
.cc-btn.cc-btn-out{background:transparent; color:var(--amber); border:2px solid var(--amber); padding:10px 20px; font-size:14px;}
.fops-btn{margin-top:4px; padding:10px 18px; font-size:14px;}
.fops-lnk{background:none; border:0; color:var(--muted); font:inherit; font-size:13px; font-weight:700; text-decoration:underline; cursor:pointer; padding:6px 0;}
.fops-lnk.danger{color:#FFB3AE;}
.fops-lnk.strong{color:var(--amber); text-decoration:none; border:1px solid var(--amber); border-radius:999px; padding:6px 12px;}
.fops-warn{margin-top:8px; padding:8px 10px; border-radius:10px; background:rgba(253,181,21,.12); color:var(--bone); font-size:var(--fs-sm); line-height:1.4;}
.fops-hint{margin:6px 0 2px; font-size:13px; font-weight:700;} .fops-hint.on{color:#5fd6a4;} .fops-hint.off{color:var(--amber);}
.fops-screen #fops-body{text-align:left;}
.fops-screen #fops-head.has-list{padding-bottom:14px; border-bottom:1px solid var(--line);}
.fops-screen .fops-intro{line-height:1.5; margin-bottom:14px;} .fops-screen .fops-intro b{color:var(--bone);}
.fops-screen #fops-head .fops-nums, .fops-screen #fops-head .fops-row{justify-content:center;}
.fops-screen #fops-head .fops-warn{text-align:left;}
.fops-screen .fops-bar{margin:12px auto 8px; max-width:340px;}
.fops-chips{margin:14px 0 6px; justify-content:center;} .fops-chips .chip{cursor:pointer; font:inherit; font-size:13px; font-weight:800; background:transparent;}
.fops-chips .chip[data-chip="missing"]{border-color:var(--amber); color:var(--amber);}
.fops-chips .chip[data-chip="found"]{border-color:#5fd6a4; color:#5fd6a4;}
.fops-chips .chip[data-chip="additional"]{border-color:#8fb9ea; color:#8fb9ea;}
.fops-chips .chip.dim{opacity:.6;}
.fops-chips .chip.on[data-chip="missing"]{background:var(--amber); color:#141414;}
.fops-chips .chip.on[data-chip="found"]{background:#5fd6a4; color:#141414;}
.fops-chips .chip.on[data-chip="additional"]{background:#8fb9ea; color:#141414;}
.fops-lot{color:var(--muted); font-weight:600; font-size:13px; margin-left:6px;}
/* The list is an inset, scrollable panel; on the Field Ops screen the page itself is locked (body.cc-fixed) and
   the panel takes every pixel left under the header, chips and search, down to the bottom of the screen. */
#fops-list{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; margin-top:8px; padding:8px;
  background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:14px;
  box-shadow:inset 0 10px 10px -10px rgba(0,0,0,.75), inset 0 -10px 10px -10px rgba(0,0,0,.75);}
#fops-list .ctc:first-child{margin-top:0;}
#fops-list .ctc{background:var(--panel);}
body.cc-fixed .fops-screen{flex:0 0 auto; width:100%; max-width:420px; margin:0 auto;}
body.cc-fixed .fops-screen.has-list{flex:1; min-height:0; display:flex; flex-direction:column; padding:16px 14px calc(var(--sab) + 14px);}   /* the panel ends a little above the card's bottom edge */
body.cc-fixed .fops-screen.has-list #fops-head{flex:0 0 auto;}
body.cc-fixed .fops-screen.has-list #fops-body{flex:1; min-height:0; display:flex; flex-direction:column;}
body.cc-fixed .fops-screen.has-list #fops-body > *{flex:0 0 auto;}
body.cc-fixed .fops-screen.has-list #fops-list{flex:1 1 auto; min-height:0; max-height:none; margin-bottom:0;}
.cc-note{margin:12px 0 2px; padding:9px 12px; border-radius:12px; background:rgba(253,181,21,.12);
  border:1px solid rgba(253,181,21,.42); color:var(--bone); font-size:13.5px; line-height:1.4;}
.cc-note b{color:var(--amber); font-size:16px;}
.cc-break{margin:12px 0 0; color:var(--muted); font-size:12.5px; line-height:1.5;}
/* cycle-count scanner: targeting box, scan flash, focus, expiry + required-lot */
#cc-target{position:absolute; left:14%; right:14%; top:19%; bottom:19%; pointer-events:none; z-index:4;}
#cc-target i{position:absolute; width:26px; height:26px;}
#cc-target i:nth-child(1){left:0; top:0; border-left:3px solid rgba(253,181,21,.95); border-top:3px solid rgba(253,181,21,.95); border-top-left-radius:6px;}
#cc-target i:nth-child(2){right:0; top:0; border-right:3px solid rgba(253,181,21,.95); border-top:3px solid rgba(253,181,21,.95); border-top-right-radius:6px;}
#cc-target i:nth-child(3){left:0; bottom:0; border-left:3px solid rgba(253,181,21,.95); border-bottom:3px solid rgba(253,181,21,.95); border-bottom-left-radius:6px;}
#cc-target i:nth-child(4){right:0; bottom:0; border-right:3px solid rgba(253,181,21,.95); border-bottom:3px solid rgba(253,181,21,.95); border-bottom-right-radius:6px;}
#cc-flash{position:absolute; inset:0; pointer-events:none; z-index:6; border-radius:16px; opacity:0;
  box-shadow:inset 0 0 0 3px #35D07F, inset 0 0 34px 7px rgba(53,208,127,.85);}
#cc-flash.go{animation:ccflash 2.1s ease-out forwards;}
@keyframes ccflash{0%{opacity:0;} 7%{opacity:1;} 100%{opacity:0;}}
.cc-help{position:absolute; right:10px; top:48px; border:0; background:rgba(0,0,0,.45); color:#fff;
  border-radius:999px; width:36px; height:36px; font-size:18px; font-weight:800; line-height:1; z-index:5;}
.cc-help:active{background:var(--amber); color:#141414;}
.cc-help-steps{text-align:left; font-size:13px; line-height:1.5; color:var(--muted); margin:10px 0 4px;}
.cc-focus{position:absolute; right:10px; top:48px; border:0; background:rgba(0,0,0,.45); color:#fff;
  border-radius:999px; width:36px; height:36px; font-size:18px; line-height:1; z-index:5;}
.cc-focus:active{background:var(--amber); color:#141414;}
.cc-exptag{display:inline-block; margin:6px 0 2px; padding:3px 11px; border-radius:999px;
  background:#B3261E; color:#fff; font-weight:800; font-size:12px; letter-spacing:.05em;}
.ccr-exp{display:inline-block; margin-left:7px; padding:1px 7px; border-radius:999px;
  background:#B3261E; color:#fff; font-weight:800; font-size:10.5px; letter-spacing:.04em; vertical-align:middle;}
.cc-in.cc-need{border-color:#FF8A85; box-shadow:0 0 0 2px rgba(255,138,133,.28);}
.cc-hint{color:#FF8A85; font-size:12px; margin:2px 0 0; text-align:center;}
.about-quote .aq-by{display:block; margin-top:7px; font-style:normal; color:var(--muted); font-size:11px; letter-spacing:.08em;}
#content.homeview .a2hs{margin-top:10px;}
#content.homeview .foot{margin-top:auto; padding-top:12px;}
.tile-scan{border:1.5px dashed #7a6426;}
.tile-scan b{color:var(--amber);}
.tile-scan .tico{background:rgba(253,181,21,.14); border-style:dashed;}

/* what's new — floating card at top */
#wncard{position:fixed; left:10px; right:10px; top:calc(var(--sat) + var(--hdr-pad) + var(--hdr-row) + 8px); z-index:78;
  background:var(--panel); border:1px solid #6b5a2a; border-left:4px solid var(--amber);
  border-radius:12px; padding:12px 14px; margin:0; box-shadow:0 10px 28px rgba(0,0,0,.5);
  animation:wnin .3s ease; max-height:calc(100dvh - 220px); overflow-y:auto;}
@keyframes wnin{from{opacity:0; transform:translateY(-12px);} to{opacity:1; transform:none;}}
#wncard.bye{opacity:0; transform:translateY(-10px); transition:opacity .25s, transform .25s;}
#wncard .wn-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
#wncard .wn-h span{color:var(--amber); font-weight:800; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase;}
#wndismiss{border:0; background:none; color:var(--muted); font-size:15px; padding:0; min-width:44px; min-height:44px; margin:-6px -8px -6px 0;
  display:flex; align-items:center; justify-content:center;} /* P17: a 44 pt target around the line close icon */
.wn-i{display:block; width:100%; text-align:left; background:none; border:0; color:var(--bone);
  font:inherit; font-size:13.5px; line-height:1.45; padding:5px 0; border-top:1px solid var(--line);}
.wn-i:first-of-type{border-top:0;}
.wn-i b{color:var(--muted); font-weight:700; font-size:11.5px; margin-right:6px;}
button.wn-i{cursor:pointer;} button.wn-i:active{background:var(--panel2);}
#wncard .wn-i.wn-x{display:none;}
#wncard.open .wn-i.wn-x{display:block;}
#wnmore{display:block; width:100%; background:none; border:0; color:var(--amber);
  font-weight:700; font-size:13px; text-align:left; padding:9px 0 2px; cursor:pointer;}
/* expiration banner */
#expban{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:80;
  width:min(300px, calc(100% - 48px)); border-radius:20px; padding:22px 18px 20px; text-align:center;
  box-shadow:0 12px 34px rgba(0,0,0,.55); animation:xbpop .22s ease-out;}
@keyframes xbpop{from{opacity:0; transform:translate(-50%,-50%) scale(.92);} to{opacity:1; transform:translate(-50%,-50%) scale(1);}}
#expban.expired{background:#4A1214; border:1.5px solid #D06A68; color:#FFC9C5;}
#expban.soon{background:#3A2A14; border:1.5px solid #8a6420; color:#FFD98A;}
#expban .xb-ico{font-size:30px; line-height:1; margin-bottom:8px;}
#expban .xb-t{font-size:19px; font-weight:800; letter-spacing:.3px; line-height:1.25;}
#expban.expired .xb-t{color:#FF8A85;}
#expban.soon .xb-t{color:var(--amber);}
#expban .xb-days{margin-top:4px; font-size:13.5px; font-weight:700;}
#expban .xb-sub{margin-top:7px; font-size:15px; font-weight:600;}
#expban .xb-dn{margin-top:9px; font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#FF8A85;}
#expban #expban-x{position:absolute; right:4px; top:4px; border:0; background:none; color:inherit;
  font-size:14px; padding:9px; cursor:pointer; opacity:.85;}
/* part-number change popup (retired numbers still in circulation) */
#pnmove{position:fixed; inset:0; z-index:85; background:rgba(12,12,12,.78); display:flex;
  align-items:center; justify-content:center; padding:24px; animation:vtin .2s ease;}
#pnmove .pnm-card{position:relative; width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line);
  border-top:3px solid var(--amber); border-radius:18px; padding:22px 20px 18px; text-align:center; box-shadow:0 12px 34px rgba(0,0,0,.55);}
#pnmove .pnm-x{position:absolute; right:4px; top:4px; border:0; background:none; color:var(--muted); font-size:15px; padding:10px; cursor:pointer;}
#pnmove .pnm-eyebrow{font-size:11.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--amber);}
#pnmove .pnm-map{display:flex; align-items:center; justify-content:center; gap:12px; margin:14px 0 10px;}
#pnmove .pnm-pn{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0;}
#pnmove .pnm-pn span{font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
#pnmove .pnm-pn b{font-size:17px; font-weight:700; color:var(--dim);}
#pnmove .pnm-pn.now b{color:var(--amber);}
#pnmove .pnm-arrow{font-size:20px; color:var(--muted); padding-top:14px;}
#pnmove .pnm-name{font-size:15px; font-weight:700; line-height:1.35;}
#pnmove .pnm-note{margin:10px 0 16px; color:#CFCBC4; font-size:13.5px; line-height:1.5; text-align:left;}
#pnmove .pnm-ok{width:100%; border:0; background:var(--amber); color:#141414; font-weight:700;
  font-size:16px; border-radius:12px; min-height:48px; cursor:pointer;}
#pnmove .pnm-ok:active{background:var(--amber-press);}
.pnm-sr{display:block; width:100%; box-sizing:border-box; text-align:left; margin:4px 0 10px; padding:11px 12px; border-radius:10px;
  border:1px solid #6b5a2a; border-left:3px solid var(--amber); background:#2E2C28; color:var(--bone);
  font-family:inherit; font-size:13.5px; line-height:1.45; cursor:pointer;}
.pnm-sr b{color:var(--amber);}
.pnm-sr .pnm-why{color:var(--amber); font-weight:700; white-space:nowrap;}
/* welcome tour */
#tour{position:fixed; inset:0; z-index:90; background:rgba(12,12,12,.92); display:flex;
  align-items:center; justify-content:center; padding:24px; animation:vtin .25s ease;}
#tour .tr-card{width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line);
  border-radius:20px; padding:30px 24px 20px; text-align:center;}
#tour .tr-ico{width:64px; height:64px; margin:0 auto 18px; border-radius:18px;
  background:rgba(253,181,21,.12); border:1px solid rgba(253,181,21,.2);
  display:flex; align-items:center; justify-content:center;}
#tour h2{margin:0 0 8px; font-size:20px; font-weight:700;}
#tour p{margin:0 0 20px; color:var(--muted); font-size:14.5px; line-height:1.55;}
#tour .tr-dots{display:flex; gap:7px; justify-content:center; margin-bottom:18px;}
#tour .tr-dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
#tour .tr-dot.on{background:var(--amber);}
#tour .tr-next{width:100%; border:0; background:var(--amber); color:#141414; font-weight:700;
  font-size:16px; border-radius:12px; min-height:50px; cursor:pointer;}
#tour .tr-next:active{background:var(--amber-press);}
#tour .tr-skip{border:0; background:none; color:var(--muted); font-weight:600; font-size:13.5px;
  margin-top:10px; padding:8px; cursor:pointer;}
/* add-to-home-screen */
.a2hs{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px dashed #6b5a2a;
  border-radius:14px; padding:12px 14px; margin-top:14px;}
.a2hs .ai{flex:none; width:38px; height:38px; border-radius:10px; background:rgba(253,181,21,.1);
  display:flex; align-items:center; justify-content:center;}
.a2hs .at{flex:1; min-width:0;}
.a2hs .at b{display:block; font-size:14px;}
.a2hs .at span{display:block; color:var(--muted); font-size:12px; margin-top:1px;}
.a2hs .ago{flex:none; border:1.5px solid var(--amber); background:none; color:var(--amber);
  font-weight:700; font-size:13px; border-radius:999px; padding:8px 14px; cursor:pointer;}
.a2hs .ax{flex:none; border:0; background:none; color:var(--muted); font-size:15px; padding:6px 4px; cursor:pointer;}
#a2hs-sheet{position:fixed; inset:0; z-index:92; background:rgba(0,0,0,.62); display:flex; align-items:flex-end;}
#a2hs-sheet[hidden]{display:none;}
#a2hs-sheet .as-card{width:100%; background:var(--panel); border-radius:20px 20px 0 0;
  padding:22px 20px calc(var(--sab) + 22px); border-top:1px solid var(--line);}
#a2hs-sheet h3{margin:0 0 12px; font-size:17px;}
#a2hs-sheet ol{margin:0 0 18px; padding-left:22px; font-size:14.5px; line-height:2;}
#a2hs-sheet .as-close{width:100%; border:1px solid var(--line); background:var(--panel2); color:var(--bone);
  font-weight:700; font-size:15px; border-radius:12px; min-height:46px; cursor:pointer;}
/* about */
.footlink{border:0; background:none; color:var(--amber); font-weight:700; font-size:12.5px; padding:6px 8px; cursor:pointer;}
.footsep{color:var(--muted); margin:0 2px;}
.about-logo{width:72px; height:72px; margin:4px auto 10px; display:block;}
.tip{font-size:14px; line-height:1.55; padding:10px 0; border-top:1px solid var(--line); text-align:left;}
.tip:first-child{border-top:0; padding-top:2px;}
.tip b{color:var(--amber);}

/* image lightbox */
#lb{position:fixed; inset:0; z-index:110; background:rgba(10,10,10,.96); display:flex;
  align-items:center; justify-content:center; touch-action:none;}
#lb[hidden]{display:none;}
#lb img{max-width:100%; max-height:100%; transform-origin:0 0; user-select:none; -webkit-user-drag:none;}
#lb-close{position:fixed; top:calc(var(--sat) + var(--hdr-pad)); right:12px; z-index:111;
  width:44px; height:44px; border-radius:50%; border:1px solid #56524A; background:rgba(42,42,42,.94);
  color:var(--bone); font-size:18px;}
#lb-hint{position:fixed; bottom:calc(var(--sab) + 16px); left:0; right:0; text-align:center;
  color:var(--muted); font-size:12px; pointer-events:none;}
#content img{cursor:zoom-in;}

/* barcode scanner */
#bottombar{display:flex; gap:10px; align-items:center;}
/* P18 landscape: side safe areas + compact bars on catalog screens (CC / F&A untouched) */
body:not(.ct-chrome-off) #bar{padding-left:max(14px, var(--sal, 0px)); padding-right:max(14px, var(--sar, 0px));}
body:not(.ct-chrome-off) #bar::after{margin-left:calc(-1 * max(14px, var(--sal, 0px))); margin-right:calc(-1 * max(14px, var(--sar, 0px)));}
body:not(.ct-chrome-off) main{padding-left:max(14px, var(--sal, 0px)); padding-right:max(14px, var(--sar, 0px));}
#bottombar{padding-left:max(14px, var(--sal, 0px)); padding-right:max(14px, var(--sar, 0px));}
body:not(.ct-chrome-off) #fb-fab{right:max(14px, var(--sar, 0px));}
#glosspanel{left:max(12px, var(--sal, 0px)); right:max(12px, var(--sar, 0px));}
@media (orientation:landscape) and (max-height:500px){
  body:not(.ct-chrome-off){--hdr-row:calc(44px / var(--z)); --hdr-pad:calc(6px / var(--z));}
  #bottombar{padding-top:6px; padding-bottom:calc(var(--sab) + 6px);}
  #bottombar .search input{height:44px;} #bottombar #scanbtn{height:44px;}
  body:not(.ct-chrome-off) main{padding-bottom:calc(var(--sab) + 72px);}
  body:not(.ct-chrome-off) #fb-fab{bottom:calc(62px + var(--sab));}
  body:not(.ct-chrome-off) #updbanner{bottom:calc(var(--sab) + 62px);}
}
/* P11 / P24: the search pill and its input may shrink, so the scan button stays on a 320 pt screen with the clear ✕ in */
#bottombar .search{flex:1 1 auto; min-width:0; margin:0;}
.search input{min-width:0; width:100%;}
@media (max-width:359px){ #bottombar{gap:6px; padding-left:12px; padding-right:12px;} #bottombar #scanbtn{width:48px;}
  #bottombar .search{padding:0 10px; gap:8px;} }
/* P24: always-visible clear; the native iOS clear (focus-only) is hidden so there is only ever one ✕ */
#q::-webkit-search-cancel-button{-webkit-appearance:none; appearance:none; display:none;}
#qclear{flex:none; width:44px; height:44px; margin-right:-10px; border:0; border-radius:50%; background:none; color:var(--muted);
  display:flex; align-items:center; justify-content:center; cursor:pointer;}
#qclear[hidden]{display:none;}
#qclear:active{background:var(--panel2); color:var(--bone);}
#scanbtn{flex:none; width:52px; height:52px; border-radius:var(--radius); border:1px solid var(--line);
  background:var(--panel); color:var(--amber); display:flex; align-items:center; justify-content:center;}
#scanbtn:active{background:var(--panel2);}
#scan-ov{position:fixed; inset:0; z-index:120; background:#000; display:flex; flex-direction:column;}
#scan-ov[hidden]{display:none;}
#scan-video{flex:1; width:100%; object-fit:cover; background:#111;}
#scan-top{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center;
  padding:calc(var(--sat) + var(--hdr-pad)) 14px 10px; background:linear-gradient(rgba(0,0,0,.6), transparent);}
#scan-top b{color:#fff; font-size:16px;}
#scan-close{width:44px; height:44px; border-radius:50%; border:1px solid #56524A; background:rgba(42,42,42,.94);
  color:#fff; font-size:18px;}
.scan-actions{display:flex; gap:10px; align-items:center;}
#scan-torch{width:44px; height:44px; border-radius:50%; border:1px solid #56524A; background:rgba(42,42,42,.94);
  color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
#scan-torch[hidden]{display:none;}
#scan-torch.on{background:var(--amber); border-color:var(--amber); color:#141414;}
#scan-frame{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
