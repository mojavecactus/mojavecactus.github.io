<script>
/* P4 — start-up fail-safe. Lives in index.html because it has to work when the app bundle is what failed.
   TBX_PROBE(ms): does OUR site answer? A HEAD request skips the service worker (it only serves GET), so the cached app
     can't fake it, and behind a hospital captive portal the TLS handshake fails → false. navigator.onLine alone lies there.
   TBX_FAIL(phase, err): keep the saved login, reset __tbxBooted, show the "ToolBox didn't open" card.
   The 4-second watchdog below never wipes while offline, never unregisters the service worker, and only ever deletes
   the app-shell cache (tbx-vNNN-…) — never the photo cache (tbx-img) or queued feedback (tbx-fbq). */
(function () {
  var SHELL = /^tbx-v\d+-/;
  window.TBX_PROBE = function (ms) {
    if (navigator.onLine === false) return Promise.resolve(false);
    return new Promise(function (res) {
      var done = false, ac = null;
      try { ac = new AbortController(); } catch (e) {}
      var t = setTimeout(function () { if (!done) { done = true; try { if (ac) ac.abort(); } catch (e) {} res(false); } }, ms || 4000);
      try {
        fetch('./?probe=' + Date.now(), { method: 'HEAD', cache: 'no-store', signal: ac ? ac.signal : undefined }).then(function (r) {
          if (!done) { done = true; clearTimeout(t); res(r.status > 0 && r.status < 500); }
        }, function () { if (!done) { done = true; clearTimeout(t); res(false); } });
      } catch (e) { done = true; clearTimeout(t); res(false); }
    });
  };
  function unsent() {
    var n = 0, fa = false;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (/^tbx_.+_ops$/.test(k)) { try { n += (JSON.parse(localStorage.getItem(k) || '[]') || []).length; } catch (e) {} }
      }
      fa = !!localStorage.getItem('tbx_fa2_pend');
    } catch (e) {}
    return { n: n, fa: fa };
  }
  function appVer() { var s = document.querySelector('script[src^="app-"]'); var m = s && /app-([\d.]+)\.js/.exec(s.getAttribute('src')); return m ? m[1] : '?'; }
  function update(btn) {
    btn.disabled = true; btn.textContent = 'Checking…';
    function reset(t) { btn.textContent = t; setTimeout(function () { btn.disabled = false; btn.textContent = 'Check for update'; }, 2600); }
    if (!(navigator.serviceWorker && navigator.serviceWorker.getRegistration)) return reset('Not available here');
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) throw 0;
      return reg.update().then(function () {
        return new Promise(function (res) {
          var t0 = Date.now();
          (function poll() { if (reg.waiting) return res(reg.waiting); if (!reg.installing || Date.now() - t0 > 60000) return res(null); setTimeout(poll, 500); })();
        });
      });
    }).then(function (w) {
      if (!w) return reset('No update yet');
      btn.textContent = 'Updating…';
      navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
      w.postMessage('SKIP_WAITING');
      setTimeout(function () { location.reload(); }, 5000);
    }).catch(function () { reset('Couldn’t check'); });
  }
  function card(info, online) {
    var el = document.getElementById('booterr');
    if (!el) {
      el = document.createElement('div'); el.id = 'booterr';
      el.setAttribute('role', 'alertdialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'be-t'); el.setAttribute('aria-describedby', 'be-b');
      document.body.appendChild(el);
    }
    var u = unsent(), keep = ['your saved login'];
    if (u.n) keep.push(u.n + ' unsent cycle-count scan' + (u.n === 1 ? '' : 's'));
    if (u.fa) keep.push('your unsent F&A save');
    var safe = keep.length === 1 ? 'Your saved login is safe on this phone.'
      : 'Your saved login' + (keep.length === 3 ? ', ' + keep[1] + ' and ' + keep[2] : ' and ' + keep[1]) + ' are safe on this phone.';
    var body = info.phase === 'fetch'
      ? (online ? 'ToolBox couldn’t load its data. Check your connection and try again.'
                : 'ToolBox needs signal once more to finish saving its data on this phone. Try again when you’re connected.')
      : info.phase === 'stall'
      ? (online ? 'ToolBox is taking too long to open.' : 'ToolBox is taking too long to open, and you’re offline.')
      : (online ? 'Something in this version stopped ToolBox from opening. Checking for an update usually fixes it.'
                : 'Something in this version stopped ToolBox from opening. Try again — or check for an update when you have signal.');
    el.innerHTML = '<div class="be-card"><div class="be-ic" aria-hidden="true">!</div>' +
      '<div class="be-t" id="be-t">ToolBox didn’t open</div>' +
      '<div class="be-b" id="be-b"></div><div class="be-safe"></div>' +
      '<button type="button" class="be-btn" id="be-retry">Try again</button>' +
      (online ? '<button type="button" class="be-btn2" id="be-upd">Check for update</button>' : '') +
      '<div class="be-code"></div></div>';
    el.querySelector('.be-b').textContent = body;
    el.querySelector('.be-safe').textContent = safe;
    el.querySelector('.be-code').textContent = 'E-' + info.phase.toUpperCase() + ' · v' + appVer() + ' · ' + info.name + (info.msg ? ': ' + info.msg : '');
    el.querySelector('#be-retry').onclick = function () { location.reload(); };
    var ub = el.querySelector('#be-upd'); if (ub) ub.onclick = function () { update(ub); };
    el.hidden = false;
    try { el.querySelector('#be-retry').focus(); } catch (e) {}
  }
  window.TBX_FAIL = function (phase, e) {
    window.__tbxBooted = false;                 // a later retry may boot again
    window.__tbxBootPhase = 'failed';
    var info = { phase: phase, name: (e && e.name) || 'Error', msg: String((e && e.message) || e || '').slice(0, 140) };
    window.__tbxBootErr = info;
    try { document.documentElement.classList.add('tbx-failed'); } catch (x) {}
    try { window.dispatchEvent(new CustomEvent('tbx-boot-failed', { detail: info })); } catch (x) {}   // hook for start-up error reporting
    try { console.error('[ToolBox] start failed (' + phase + ')', e); } catch (x) {}
    function show() { window.TBX_PROBE(3000).then(function (on) { card(info, on); }); }
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  };
  window.addEventListener('load', function () {
    var t0 = Date.now();
    setTimeout(function check() {
      if (!document.documentElement.classList.contains('authed') || window.__tbxBootErr) return;
      var c = document.getElementById('content');
      if (c && c.innerHTML && c.innerHTML.length > 10) return;
      var ph = window.__tbxBootPhase;
      if (ph && ph !== 'booted' && ph !== 'failed' && Date.now() - t0 < 20000) return setTimeout(check, 1000);  // still starting on a slow phone: wait, don't wipe
      var again = false;
      try { again = !!sessionStorage.getItem('tbx_failsafe'); sessionStorage.setItem('tbx_failsafe', '1'); } catch (e) {}
      window.TBX_PROBE(4000).then(function (on) {
        if (!on || again) { window.TBX_FAIL('stall', new Error('blank after start (' + (ph || 'no phase') + ')')); return; }
        function go() { location.reload(); }
        try {
          caches.keys().then(function (ks) {
            return Promise.all(ks.filter(function (k) { return SHELL.test(k); }).map(function (k) { return caches.delete(k); }));
          }).then(go, go);
        } catch (e) { go(); }
      });
    }, 4000);
  });
})();
</script>

<script>
(function () {
  /* iOS 27 home-screen apps honour the phone's page-zoom setting (75%, 85%, …) but still report
     env(safe-area-inset-*) in unzoomed points, so at 75% the header covers only three quarters of the
     status bar. Measure the zoom and hand it to CSS as --z; every length that must stay put on screen —
     status-bar / home-indicator clearance and the header row — divides by it. Works for zoom-out and
     zoom-in alike. iPhone home-screen launches only; at 100% nothing is set and the CSS computes to
     exactly today's values. No iOS-version check: since iOS 26 the UA is frozen at "OS 18_7", and
     iOS ≤ 26 never zooms a web app, so the measured zoom itself is the gate.
     Diagnostics: tap the header title 5 times within 2 s to show the numbers behind this. */
  var SHELL = 'tbx-v372';
  var root = document.documentElement, ua = navigator.userAgent || '';
  var PRESETS = [0.5, 0.75, 0.85, 1, 1.15, 1.25, 1.5, 1.75, 2, 2.5, 3];
  function nearPreset(z) { for (var i = 0; i < PRESETS.length; i++) if (Math.abs(PRESETS[i] - z) < 0.02) return PRESETS[i]; return null; }
  function measure() {
    var w = window.innerWidth, h = window.innerHeight, sw = screen.width, sh = screen.height, dpr = window.devicePixelRatio || 1;
    var ref = w > h ? Math.max(sw, sh) : Math.min(sw, sh);           /* the screen edge innerWidth spans; innerWidth ignores the keyboard */
    var zs = (w > 0 && ref > 0) ? Math.round(ref / w * 1000) / 1000 : 1;
    var how = 'screen';
    if (Math.abs(zs - 1) < 0.005 && Math.abs(dpr - Math.round(dpr)) > 0.02) {
      /* screen size scaled along with the zoom (so the ratio hides it) but the pixel ratio did not: an iPhone at 100% is exactly 2× or 3× */
      var c3 = nearPreset(dpr / 3), c2 = nearPreset(dpr / 2);
      var zd = c3 !== null ? c3 : c2;
      if (zd !== null) { zs = zd; how = 'dpr'; }
    }
    var z = Math.min(3, Math.max(0.5, zs));
    if (!(z > 0)) z = 1;
    return { w: w, h: h, sw: sw, sh: sh, dpr: dpr, z: z, how: how };
  }
  var iphone = /iPhone/.test(ua);
  var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || (iphone && !/Safari\//.test(ua));
  var active = iphone && standalone;
  function apply() {
    if (!active) return;
    var m = measure();
    if (Math.abs(m.z - 1) < 0.005) root.style.removeProperty('--z'); else root.style.setProperty('--z', String(m.z));
  }
  try {
    apply();
    window.addEventListener('resize', apply);
    window.addEventListener('orientationchange', function () { setTimeout(apply, 80); });
    window.TBX_ZOOM = apply;
  } catch (e) {}
  try {
    document.addEventListener('DOMContentLoaded', function () {
      var t = document.getElementById('title'); if (!t) return;
      var taps = [];
      t.addEventListener('click', function () {
        var now = Date.now(); taps.push(now); taps = taps.filter(function (x) { return now - x < 2000; });
        if (taps.length < 5) return;
        taps = [];
        var old = document.getElementById('zdbg'); if (old) { old.remove(); return; }
        var m = measure(), cs = getComputedStyle(root), bar = document.getElementById('bar');
        var probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top, 0px);visibility:hidden;pointer-events:none';
        document.body.appendChild(probe); var inset = getComputedStyle(probe).height; probe.remove();
        var box = document.createElement('pre'); box.id = 'zdbg';
        box.style.cssText = 'position:fixed;left:8px;right:8px;top:38%;z-index:9999;margin:0;padding:12px 14px;border-radius:12px;background:rgba(20,20,20,.97);color:#F4F2EE;border:1px solid #6b5a2a;font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;box-shadow:0 10px 28px rgba(0,0,0,.5)';
        box.textContent = [
          'shell ' + SHELL + '   active ' + active + ' (iphone ' + iphone + ', standalone ' + standalone + ')',
          '--z ' + (cs.getPropertyValue('--z').trim() || '(unset = 1)') + '   measured ' + m.z + ' via ' + m.how,
          'inner ' + m.w + '×' + m.h + '   screen ' + m.sw + '×' + m.sh + '   dpr ' + m.dpr,
          'inset-top ' + inset + '   bar padding-top ' + (bar ? getComputedStyle(bar).paddingTop : '?'),
          'navigator.standalone ' + String(navigator.standalone) + '   display-mode standalone ' + (window.matchMedia ? matchMedia('(display-mode: standalone)').matches : '?'),
          'ua ' + ua,
          '(tap this box to close)'
        ].join('\n');
        box.addEventListener('click', function () { box.remove(); });
        document.body.appendChild(box);
      });
    });
  } catch (e) {}
})();
</script>

<style>
:root{
  --ink:#1E1E1E; --panel:#2A2A2A; --panel2:#242424; --line:#3A3A3A;
  --amber:#FDB515; --amber-press:#E5A30F; --green:#4CC97A;
  --bone:#F4F2EE; --muted:#9B968E; --dim:#CFCFCF; --danger:#F28B8B; --green-soft:#BFE9CC;
  --radius:12px;
  /* type scale: every size below is one of these six */
  --fs-xs:11px; --fs-sm:12.5px; --fs-md:14px; --fs-base:16px; --fs-lg:18px; --fs-xl:20px;
  /* page zoom compensation (see the head script): --z is 1 everywhere except zoomed iOS 27 home-screen launches.
     --sat/--sab replace env(safe-area-inset-top/bottom); the header's own padding and row height scale the same
     way so the title sits at the same spot on screen at any zoom. */
  --z:1;
  --sat:calc(env(safe-area-inset-top, 0px) / var(--z));
  --sab:calc(env(safe-area-inset-bottom, 0px) / var(--z));
  --hdr-pad:calc(10px / var(--z));
  --hdr-row:calc(56px / var(--z));
  /* P18 landscape: side safe areas, same zoom rule as --sat/--sab */
  --sal:calc(env(safe-area-inset-left, 0px) / var(--z));
  --sar:calc(env(safe-area-inset-right, 0px) / var(--z));
}
/* P36 catalog header: a 44 pt row with the title where it is today (pad 10 -> 16, row 56 -> 44, rule gap 8 -> 5: 9 pt
   shorter), so the iOS 27 top blur still clears it. Catalog screens only: cycle count / F&A (body.ct-chrome-off) keep
   56 + 10 and 52 pt buttons. Set on body, not :root, so the landscape rule further down still wins in landscape. */
body:not(.ct-chrome-off){--hdr-row:calc(44px / var(--z)); --hdr-pad:calc(16px / var(--z));}
body:not(.ct-chrome-off) #bar::after{margin-top:5px;}
body:not(.ct-chrome-off) .navbtn{width:44px; height:44px; border-radius:12px;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--ink); color:var(--bone);
  font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
.mono{font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums;}
#bar{position:sticky; top:0; z-index:10; background:var(--ink);
  padding:calc(var(--sat) + var(--hdr-pad)) 14px 0; }
#bar .row{display:flex; align-items:center; gap:8px; min-height:var(--hdr-row);}
#bar .t{flex:1; text-align:center; font-size:clamp(15px, 4.6vw, 19px); font-weight:700; letter-spacing:.2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#bar .t em{font-style:normal; color:var(--amber);}
.t em.sup{font-size:.5em; font-weight:700; letter-spacing:.06em; text-transform:uppercase; vertical-align:super; line-height:0; margin-left:.15em;}
#bar::after{content:""; display:block; height:3px; background:var(--amber);
  margin:8px -14px 0; border-radius:0;}
.navbtn{width:52px; height:52px; border:1px solid var(--line); background:var(--panel);
  color:var(--bone); display:flex; align-items:center; justify-content:center; border-radius:14px;
  position:relative; transition:transform .08s ease; cursor:pointer;}
.navbtn::after{content:""; position:absolute; inset:-8px;}
.navbtn:active{background:var(--panel2); transform:scale(.94);}
.navbtn[hidden]{visibility:hidden; display:flex;}
.navbtn svg{display:block;}
#home svg{fill:none; stroke:var(--bone); transition:fill .18s, stroke .18s;}
#home.away{border-color:#6b5a2a;}
#home.away svg{fill:var(--amber); stroke:var(--amber);}
main{padding:16px 14px calc(var(--sab) + 28px); max-width:640px; margin:0 auto;}
.eyebrow{font-size:var(--fs-xs); font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); margin:22px 2px 8px;}
.search{display:flex; align-items:center; gap:10px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--radius); padding:0 14px; margin:4px 0 6px;}
.search svg{flex:none; opacity:.55}
.search input{flex:1; background:none; border:0; outline:0; color:var(--bone);
  font-size:17px; height:52px; caret-color:var(--amber);}
.search input::placeholder{color:var(--muted);}
.tiles{display:flex; flex-direction:column; gap:10px;}
.tile{background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; min-height:68px; display:flex; align-items:center; gap:14px;
  color:var(--bone); text-align:left; font:inherit; box-shadow:0 1px 2px rgba(0,0,0,.18);}
.tile .tl{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
.tile b{font-size:var(--fs-base); line-height:1.25; font-weight:650;}
.tile .n{color:var(--amber); font-size:var(--fs-sm); font-variant-numeric:tabular-nums; font-weight:700;}
.tile .ct{color:var(--muted); flex:none; font-size:20px; line-height:1;}
.tile:active{background:var(--panel2);}
.tile-inv{background:var(--amber); border-color:var(--amber); color:#141414;}
.tile-inv b{color:#141414;}
.tile-inv .n{color:rgba(20,20,20,.75);}
.tile-inv .ct{color:#141414;}
.tile-inv:active{background:var(--amber-press);}
/* backorder report: dark-blue home tile, status pills, card banner, report screen */
.tile-bo{background:#15304F; border-color:#2E5F96; color:#EAF3FF;}
.tile-bo b{color:#EAF3FF;}
.tile-bo .n{color:#9CC9FF;}
.tile-bo .ct{color:#9CC9FF;}
.tile-bo .tico{background:rgba(156,201,255,.12); border-color:rgba(156,201,255,.24);}
.tile-bo:active{background:#1C3F69;}
.bopill{display:inline-block; border:1px solid; border-radius:6px; padding:1px 7px; font-size:10.5px; font-weight:800; white-space:nowrap; letter-spacing:.35px; text-transform:uppercase; vertical-align:middle; line-height:1.5;}
.bopill.bo{background:#3A1516; color:#FFB3AE; border-color:#D06A68;}
.bopill.ctl{background:#3A2A14; color:#FFD98A; border-color:#8A6420;}
.bopill.clr{background:#143A22; color:#9BE3B4; border-color:#3E8A55;}
.card h1 .bopill{font-size:11px; margin-left:4px; position:relative; top:-2px;}
.bobanner{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:0 0 14px;}
.bobanner .bo-line{display:block; font-size:13.5px; font-weight:600; color:var(--bone); line-height:1.5;}
.bobanner .bo-line .bopill{margin-right:7px; position:relative; top:-1px;}
.bobanner .bo-w{display:inline;}
.bobanner .bo-line + .bo-line{margin-top:8px;}
.bobanner .bo-msg{color:#C9C5BE; font-size:13px; line-height:1.45; margin:6px 0 4px;}
.bo-asof{color:var(--muted); font-weight:500; white-space:nowrap;}
.bobanner .bo-more{display:block; margin-top:8px; border:0; background:none; color:var(--amber); font-weight:700; font-size:12.5px; padding:0; cursor:pointer; font-family:inherit;}
.bo-card{position:relative; padding:14px 16px 12px; margin-bottom:12px;}
.bo-head{display:flex; align-items:flex-start; gap:10px; padding-right:40px;}
.bo-title{font-size:var(--fs-md); font-weight:700; color:var(--bone);}
.bo-sub{margin:3px 0 0;}
.bo-rf{top:14px; right:14px; transition:opacity .15s;}
.bo-rf.spin{animation:bo-spin .8s linear infinite; opacity:.85;}
@keyframes bo-spin{to{transform:rotate(360deg);}}
.bo-chips{display:flex; flex-wrap:nowrap; gap:8px; margin:10px -16px 0; padding:2px 16px 2px; overflow-x:auto; overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;} /* P47: one row that scrolls; the next chip peeks at the edge */
.bo-chips::-webkit-scrollbar{display:none;}
.bo-chips[hidden]{display:none;}
.bochip{flex:none; border:1.5px solid #5a564e; background:var(--panel); color:var(--bone); font:inherit; font-weight:700; font-size:12.5px; border-radius:999px; padding:7px 12px; cursor:pointer; white-space:nowrap; transition:transform .08s ease;}
.bochip:active{transform:scale(.94);}
.bochip.on{border-color:var(--amber); color:#1E1E1E; background:var(--amber);} /* P47: amber like every other active chip */
.bo-card .cc-in{margin:12px 0 0;}
.bo-src{margin:22px 4px 4px; font-size:12.5px; line-height:1.45; color:var(--muted); text-align:center;} /* P47: footer under the lists */
.bo-late{color:var(--danger); font-weight:700;} /* P47: "Clear date passed" */
.bo-sub .bo-dot{color:var(--muted);}
.bo-sub .bo-hs{position:relative; display:inline; margin:0; padding:0; font-size:inherit;} /* P47: Highspot in the status line */
.bo-sub .bo-hs::after{content:""; position:absolute; left:-6px; right:-6px; top:-13px; bottom:-11px;} /* P40 */
.bo-hs{display:inline-block; margin-top:6px; padding:4px 0; color:var(--amber); font-weight:700; font-size:13.5px; text-decoration:underline; text-underline-offset:3px;}
.bo-hs:active{opacity:.7;}
.bo-gh{margin-top:18px;}
.bo-gh.bo{color:#FFB3AE;}
.bo-gh.ctl{color:#FFD98A;}
.bo-gh.clr{color:#9BE3B4;}
.bo-gh .bo-win{color:var(--muted); font-weight:600; letter-spacing:0; text-transform:none; font-size:12px;}
.bo-row .rl{min-width:0;}
.bo-row .bo-top{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:5px;}
.bo-row .bo-sku{color:var(--amber); font-size:12.5px; font-weight:600; letter-spacing:.2px;}
.bo-row .bo-nocat{color:var(--muted); font-size:11px; font-weight:600;}
.bo-row .rl b.ti{white-space:normal;}
.bo-row .rl span.bo-desc{white-space:normal; color:#B9B5AE;}
.bo-row .rl span.bo-meta{white-space:normal; color:var(--bone); font-weight:600; margin-top:4px;}
.bo-row .rl span.bo-asof{display:inline; margin:0; white-space:nowrap; font-size:inherit;}
.bo-row .bo-note{display:block; white-space:normal; color:#B9B5AE; font-size:12.5px; line-height:1.45; margin-top:5px; border-left:2px solid var(--line); padding-left:8px;}
.bo-nolink{cursor:default;}
.bo-nolink:active{background:var(--panel); transform:none;}
button.tile, .rowitem{cursor:pointer; width:100%;}
.list{display:flex; flex-direction:column; gap:8px;}
.rowitem{display:flex; align-items:center; gap:12px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px;
  color:var(--bone); text-align:left; font:inherit; min-height:56px;
  box-shadow:0 1px 2px rgba(0,0,0,.14);}
.pnL{flex:none; width:88px; color:var(--amber); font-size:12.5px; line-height:1.3; word-break:break-all; align-self:flex-start; padding-top:2px;}
.rl .ti{color:var(--bone);}
.rl .sz{color:#7CCFE8; font-weight:700; font-size:13.5px;}
.rl .ld{display:block; color:#B9B5AE; font-size:var(--fs-sm); margin-top:2px; line-height:1.35;}
.rl .ld.dim2{color:var(--muted);}
.uom{flex:none; color:var(--muted); font-size:11.5px; text-align:right; max-width:64px; line-height:1.3;}
.uomL{display:block; color:var(--muted); font-weight:400; font-size:11px; margin-top:3px; white-space:nowrap; letter-spacing:.2px;}
.subtags{flex:none; display:flex; flex-direction:column; gap:4px; align-items:flex-end; max-width:112px; margin-left:4px;}
.subtag{display:inline-block; background:#123038; color:#7CCFE8; border:1px solid #2f5b6b; border-radius:6px; padding:1px 7px; font-size:10.5px; font-weight:700; white-space:nowrap; letter-spacing:.2px; vertical-align:middle;}
.nobuild{background:#3A1516; border:1px dashed #D06A68; color:#FFB3AE; border-radius:10px; padding:10px 13px; font-size:13px; font-weight:700; margin:0 0 14px; letter-spacing:.5px; text-transform:uppercase;}
.sizehead{margin:12px 2px 6px; font-size:11.5px; font-weight:700; color:#7CCFE8;
  letter-spacing:.1em; text-transform:uppercase; opacity:.9;}
.favbtn{border:1px solid var(--line); background:var(--panel2); color:var(--bone);
  font-weight:700; font-size:14px; border-radius:999px; padding:10px 16px; min-height:44px;}
.favbtn.on{border-color:var(--amber); color:var(--amber);}
.favrow{margin:0 0 14px; display:flex; gap:8px; flex-wrap:wrap;}
/* share sheet */
#share-sheet, #ug-sheet, #ask-sheet{position:fixed; inset:0; z-index:92; background:rgba(0,0,0,.62); display:flex; align-items:flex-end;}
#share-sheet[hidden], #ug-sheet[hidden], #ask-sheet[hidden]{display:none;}
#share-sheet .as-card, #ug-sheet .as-card, #ask-sheet .as-card{width:100%; background:var(--panel); border-radius:20px 20px 0 0;
  padding:20px 20px calc(var(--sab) + 20px); border-top:1px solid var(--line);}
#share-sheet h3, #ug-sheet h3, #ask-sheet h3{margin:0 0 4px; font-size:17px;}
#ask-sheet .ask-b{color:var(--muted); font-size:14px; line-height:1.45; margin:6px 0 14px; white-space:pre-line;}
#ask-sheet .ask-row{display:flex; gap:10px;}
#ask-sheet .ask-row button{flex:1; min-height:46px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer; border:1px solid var(--line); background:var(--panel2); color:var(--bone);}
#ask-sheet .ask-row button.ok{background:var(--amber); border-color:var(--amber); color:#141414;}
#ask-sheet .ask-row button.danger{background:#5a2a29; border-color:#D06A68; color:#ffd9d8;}
#ask-sheet textarea{width:100%; min-height:120px; margin:0 0 12px; background:var(--panel2); color:var(--bone); border:1px solid var(--line); border-radius:12px; padding:10px; font:13px/1.4 ui-monospace, Menlo, monospace;}
#share-sheet .sh-sub{color:var(--muted); font-size:12.5px; margin-bottom:10px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;}
.shopt{display:flex; align-items:center; gap:14px; width:100%; background:none; border:0;
  border-top:1px solid var(--line); color:var(--bone); font-size:15.5px; font-weight:600;
  padding:14px 2px; text-align:left; cursor:pointer;}
.shopt:active{background:var(--panel2);}
.shopt .si{flex:none; width:38px; height:38px; border-radius:10px; background:rgba(253,181,21,.1);
  display:flex; align-items:center; justify-content:center;}
.shopt .sl{flex:1; min-width:0;}
.shopt .sl span{display:block; color:var(--muted); font-size:12px; font-weight:400; margin-top:1px;}
#share-sheet .as-close, #ug-sheet .as-close{width:100%; border:1px solid var(--line); background:var(--panel2); color:var(--bone);
  font-weight:700; font-size:15px; border-radius:12px; min-height:46px; cursor:pointer; margin-top:8px;}
.uomline{color:var(--muted); font-size:13px; margin:-6px 0 12px;}
.uomline b{color:var(--bone); font-weight:800; letter-spacing:.2px;}
.photo{display:block; width:auto; max-width:100%; border-radius:12px; border:1px solid var(--line); margin:14px auto 4px; background:#fff;} .photo-sm{width:auto; max-width:110px; max-height:150px;}
.linkrow{margin:12px 0 2px; display:flex; flex-wrap:wrap; gap:8px;}
.linkbtn{border:1px solid var(--line); background:var(--panel2); color:var(--amber); font-weight:700; font-size:13.5px; border-radius:999px; padding:9px 14px;}
.warn{background:#3A2A14; border:1px solid #8a6420; border-left:4px solid var(--amber); color:#FFD98A; border-radius:10px; padding:11px 13px; font-size:13.5px; font-weight:600; line-height:1.4; margin:0 0 14px;}
.rowitem .rl{flex:1; min-width:0;}
.rowitem .rl b{display:block; font-size:15px; font-weight:600; line-height:1.3;}
.rowitem .rl > .ld{display:block; color:var(--muted); font-size:12.5px; margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
/* P39: two description lines in catalog list rows (report rows keep their own layout); pills in a row under the title */
.rowitem:not(.bo-row) .rl > .ld{display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; white-space:normal; overflow-wrap:anywhere;}
.rl .rtags{display:flex; flex-wrap:wrap; gap:4px; margin:4px 0 1px;}
.rowitem .rl b .sz{margin-left:2px;}
/* P38: Favorites / Recents rows: part number above the title, the title gets the full width */
.rowitem.stack{padding:11px 14px;}
.rowitem.stack .pnS{display:block; color:var(--amber); font-size:12.5px; line-height:1.3; margin-bottom:2px; letter-spacing:.2px;}
.rowitem.stack .uomS{color:var(--muted); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size:11.5px;}
.rowitem .pn{color:var(--amber); font-size:13px; flex:none;}
.rowitem .ct{color:var(--muted); flex:none; font-size:18px;}
.rowitem:active{background:var(--panel2);}
.grouphead{margin:20px 2px 8px; font-size:13px; font-weight:700; color:var(--amber);
  letter-spacing:.06em; text-transform:uppercase;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 16px;}
.card h1{margin:0 0 4px; font-size:var(--fs-xl); line-height:1.3; font-weight:700;}
.card .fam{color:var(--muted); font-size:13px; margin-bottom:14px;}
.pnblock{display:flex; align-items:center; gap:12px; background:var(--panel2);
  border:1px dashed var(--line); border-radius:12px; padding:12px 14px; margin:0 0 14px;}
.pnblock .num{flex:1; min-width:0; font-size:clamp(17px, 6vw, 24px); letter-spacing:.5px; color:var(--amber); white-space:nowrap;}
.copy{border:0; background:var(--amber); color:#141414; font-weight:700; font-size:14px;
  border-radius:999px; padding:10px 16px; min-height:44px;}
.copy:active{background:var(--amber-press);}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px;}
.chip{border:1px solid var(--amber); color:#FFFFFF; border-radius:999px;
  font-size:12.5px; font-weight:700; padding:5px 12px;}
.chip.dim{border-color:var(--line); color:var(--muted); font-weight:600;}
/* label kinds — each group reads as its own colour so they're tellable apart at a glance */
.chip.k-sub{border-color:#6E5AA6; color:#C3B4EC; background:rgba(110,90,166,.14); font-weight:700;}
.chip.k-grp{border-color:#4E8A5B; color:#9BD8A9; background:rgba(78,138,91,.14); font-weight:700;}
.ledger{border-top:1px solid var(--line);}
.ledger .lr{display:grid; grid-template-columns:minmax(0,42fr) minmax(0,58fr); gap:10px; padding:10px 2px;
  border-bottom:1px solid var(--line); font-size:14.5px;}
.ledger .lk{color:var(--muted);}
.ledger .lv{white-space:pre-line; color:var(--bone);}
.ledger .lv, .ledger .lk{overflow-wrap:anywhere;}
.ledger .lhead{margin:16px 2px 4px; padding-bottom:5px; font-size:11.5px; font-weight:700; color:#7CCFE8;
  letter-spacing:.1em; text-transform:uppercase; opacity:.9; border-bottom:1px solid var(--line);}
.reflinkrow{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px;}
.refbtn{border:1.5px solid var(--amber); background:rgba(253,181,21,.08); color:var(--amber);
  font-family:inherit; font-weight:700; font-size:13.5px; line-height:1.25; letter-spacing:.1px; border-radius:10px;
  min-height:40px; padding:8px 14px; display:inline-flex; align-items:center; gap:6px; text-align:left; cursor:pointer;}
.refbtn::after{content:"\203A"; font-size:17px; line-height:1;}
.refbtn:active{background:rgba(253,181,21,.18);}
.note{margin-top:14px; font-size:13.5px; color:var(--bone); background:var(--panel2);
  border-left:3px solid var(--amber); border-radius:0 10px 10px 0; padding:10px 12px;}
.src{margin-top:12px; font-size:11.5px; color:var(--muted); line-height:1.5;}
.empty{color:var(--muted); text-align:center; padding:34px 10px; font-size:14.5px;}
.foot{margin-top:30px; text-align:center; color:var(--muted); font-size:11.5px; line-height:1.7;}
#toast{position:fixed; left:50%; bottom:calc(var(--sab) + 24px);
  transform:translateX(-50%) translateY(20px); background:var(--amber); color:#141414;
  font-weight:700; font-size:14px; border-radius:999px; padding:10px 18px; opacity:0;
  pointer-events:none; transition:opacity .18s, transform .18s;}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
#toast.act{pointer-events:auto; padding-right:8px; display:flex; align-items:center; gap:12px; white-space:nowrap;}
#toast button{border:0; background:rgba(20,20,20,.16); color:#141414; font:inherit; font-weight:800; border-radius:999px; padding:6px 12px; cursor:pointer;}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
main{padding-bottom:calc(var(--sab) + 96px);}
#bottombar{position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(var(--sab) + 10px);
  background:rgba(30,30,30,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); z-index:30;}
#toast{bottom:calc(var(--sab) + 120px);}
#updbanner{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--sab) + 78px); z-index:40;
  background:var(--amber); color:#1E1E1E; font-weight:800; font-size:14px;
  border:none; border-radius:999px; padding:12px 18px; box-shadow:0 6px 24px rgba(0,0,0,.5);}
/* P18: the update banner spans the screen (inside the side insets) instead of a half-width pill that wrapped under the bubble */
body:not(.ct-chrome-off) #updbanner{left:max(14px, var(--sal, 0px)); right:max(14px, var(--sar, 0px)); transform:none; max-width:420px; margin:0 auto; text-align:center;}
.chip.link{border-color:#B7B1A8; color:#FFFFFF; background:#3E3E3E; font-weight:700;}
.vhead{margin-top:2px;}
.fchips{display:flex; flex-wrap:wrap; gap:8px; margin:2px 2px 12px;}
.schips{display:flex; gap:8px; margin:6px 0 2px; overflow-x:auto; padding:2px 2px 6px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.schips::-webkit-scrollbar{display:none;}
.schip{flex:none; border:1.5px solid #5a564e; background:var(--panel); color:var(--bone);
  font-weight:700; font-size:12.5px; border-radius:999px; padding:8px 13px; cursor:pointer;
  white-space:nowrap; transition:transform .08s ease;}
.schip:active{transform:scale(.94);}
.schip.sort{margin-left:auto; border-style:dashed;}
.schip.sort.on{border-style:solid;}
.schip.sort .ico{width:15px; height:15px; margin-left:5px; vertical-align:-3px;}
.showall{display:block; width:100%; margin:8px 0 14px; min-height:44px; border:1px solid var(--line); background:var(--panel); color:var(--amber); font-weight:700; font-size:14px; border-radius:12px; cursor:pointer;}
.schip.on{border-color:var(--amber); color:#1E1E1E; background:var(--amber);}
/* P21: every spec filter in one horizontally scrolling row, bleeding to the screen edges; the fade says "more" */
.sfrow{display:flex; flex-wrap:nowrap; gap:8px; align-items:center; overflow-x:auto; overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; margin:2px -14px 0; padding:2px 40px 8px 14px;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);}
.sfrow::-webkit-scrollbar{display:none;}
.sfx{flex:none; display:inline-flex; align-items:center; gap:5px; min-height:44px; border:1.5px solid var(--amber); background:rgba(253,181,21,.12); color:var(--amber);
  border-radius:999px; padding:0 14px 0 11px; font:inherit; font-weight:700; font-size:12.5px; white-space:nowrap; cursor:pointer;}
.sfx .ico{width:15px; height:15px; vertical-align:0;}
.sfx:active{transform:scale(.96);}
.scount{flex:none; align-self:center; color:var(--muted); font-size:12.5px; font-weight:700; padding:0 4px; white-space:nowrap;}
.sfsel{position:relative; flex:none; display:inline-flex; align-items:center; gap:6px; border:1.5px solid #5a564e; background:var(--panel);
  color:var(--bone); border-radius:999px; padding:0 26px 0 12px; min-height:44px; font-size:12.5px; cursor:pointer; white-space:nowrap;}
.sfsel .sfv{font-weight:700; max-width:9em; overflow:hidden; text-overflow:ellipsis;}
.sfsel .sfk{color:var(--muted); font-weight:600; white-space:nowrap;}
/* the real <select> covers the whole pill, invisible: a tap anywhere on the pill opens the native picker; 16px never zooms */
.sfsel select{position:absolute; inset:0; width:100%; height:100%; opacity:0; appearance:none; -webkit-appearance:none; border:0; font-size:16px; cursor:pointer;}
.sfsel:focus-within{outline:2px solid var(--amber); outline-offset:2px;}
.sfsel select option{color:#1E1E1E; background:#FFFFFF;}
.sfsel::after{content:'\25BE'; position:absolute; right:11px; top:50%; transform:translateY(-50%); pointer-events:none; font-size:11px; color:var(--muted);}
.sfsel.on{border-color:var(--amber);}
.sfsel.on .sfk, .sfsel.on::after{color:var(--amber);}
.fchip{border:1.5px solid #A8A29A; background:#3E3E3E; color:#FFFFFF;
  font-weight:700; font-size:12.5px; border-radius:999px; padding:8px 13px;}
.fchip.on{border-color:var(--amber); color:#1E1E1E; background:var(--amber);}
.gterm{background:none; border:none; padding:0; font:inherit; color:inherit;
  border-bottom:1px dotted var(--amber); cursor:pointer;}
.gnb{white-space:nowrap;}
#glosspanel{position:fixed; left:12px; right:12px; bottom:calc(var(--sab) + 76px);
  z-index:45; background:#2E2C28; border:1px solid #6b5a2a; border-left:4px solid var(--amber);
  border-radius:12px; padding:13px 15px; color:var(--bone); font-size:14px; line-height:1.5;
  box-shadow:0 10px 30px rgba(0,0,0,.55);}
#glosspanel b{color:var(--amber); display:block; margin-bottom:3px;}
.bp{margin:14px 2px; background:#1E2B22; border:1px solid #2F5C3E; border-left:4px solid var(--green);
  border-radius:12px; padding:13px 15px;}
.bp-h{color:var(--green); font-weight:800; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px;}
.bp-b{color:var(--bone); font-size:15px; line-height:1.55; white-space:pre-line; font-weight:600;}


/* feedback */
#fb-fab{position:fixed; right:14px; bottom:calc(78px + var(--sab)); z-index:60;
  width:46px; height:46px; border-radius:50%; border:1px solid #56524A; background:rgba(42,42,42,.94);
  color:var(--amber); font-size:20px; line-height:1; box-shadow:0 4px 14px rgba(0,0,0,.5);}
#fb-fab:active{background:#333;}
#fb-fab{display:flex; align-items:center; justify-content:center;} /* P41: line chat icon */
/* P12: fades out while the page moves (.15s), back in after 600 ms still (.25s); taps pass through while it is away */
#fb-fab{transition:opacity .25s ease-in-out;}
#fb-fab.fb-away{opacity:0; pointer-events:none; transition:opacity .15s ease-out;}
body.gloss-on #fb-fab, body.upd-on #fb-fab, body.kb-on #fb-fab{opacity:0; pointer-events:none;}
/* P12: the last content on catalog screens scrolls clear of the bubble (bar 72 + gap 6 + bubble 46 + 8) */
body:not(.ct-chrome-off) #content:not(.homeview)::after{content:""; display:block; height:36px;}
/* CT Team screens are purely functional: no feedback bubble */
body.ct-chrome-off #fb-fab{display:none;}
#fb-ov{position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.62);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center; padding:12vh 18px 18px;}
#fb-ov[hidden]{display:none;}
#fb-card{width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px;}
#fb-t{font-weight:800; font-size:17px; margin-bottom:5px;}
#fb-ctx{color:var(--muted); font-size:12.5px; margin-bottom:12px; word-break:break-word;}
#fb-card input,#fb-card textarea{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  color:var(--bone); padding:11px 12px; font-size:16px; margin-bottom:10px; font-family:inherit;}
#fb-card textarea{resize:vertical; min-height:110px;}
#fb-row{display:flex; gap:10px; justify-content:flex-end;}
#fb-row button{border-radius:10px; padding:10px 16px; font-size:15px; font-weight:700; border:1px solid var(--line);}
#fb-cancel{background:var(--panel2); color:var(--bone);}
#fb-send{background:var(--amber); color:#1E1E1E; border-color:var(--amber);}
#fb-hint{color:var(--muted); font-size:12px; margin-top:10px;}
#fb-shotrow{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
#fb-shot{height:72px; max-width:44%; object-fit:cover; border:1px solid var(--line); border-radius:8px; display:none;}
#fb-shotcap{color:var(--muted); font-size:12.5px;}
/* P45 — About: feedback waiting for signal / couldn't send */
.fbq-wait{color:var(--muted);}
.fbq-dead b{color:#FFD98A;}
.fbq-row{margin-top:4px; overflow-wrap:anywhere;}
.fbq-row .footlink{padding:6px 4px;}
.fbq-s{color:var(--dim);}

/* password gate */
#lock{position:fixed; inset:0; z-index:100; background:var(--ink); display:flex;
  align-items:center; justify-content:center;
  padding:calc(var(--sat) + 24px) 20px calc(var(--sab) + 24px);}
html.authed #lock{opacity:0; visibility:hidden; pointer-events:none; transition:opacity .22s, visibility .22s;}
/* P50: after a typed unlock the app boots at once, under the lock; the lock stays up until its 0.7 s animation ends */
html.authed #lock.lk-hold{opacity:1; visibility:visible;}
#lock .lk-card{width:100%; max-width:340px; text-align:center;}
#lock .lk-badge{width:56px; height:56px; margin:0 auto 18px; border-radius:16px; background:var(--panel);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
#lock .lk-title{font-size:22px; font-weight:700; letter-spacing:.2px;}
#lock .lk-title em{font-style:normal; color:var(--amber);}
#lock .lk-sub{color:var(--muted); font-size:14px; margin:6px 0 22px;}
#lock .lk-field{display:flex; align-items:center; gap:8px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--radius); padding:0 6px 0 14px; text-align:left;}
#lock .lk-field:focus-within{border-color:var(--amber);}
#lock .lk-field input{flex:1; background:none; border:0; outline:0; color:var(--bone);
  font-size:17px; height:52px; caret-color:var(--amber); min-width:0;}
#lock .lk-field input::placeholder{color:var(--muted);}
#lock .lk-show{border:0; background:none; color:var(--muted); font-weight:700; font-size:13px;
  padding:10px 12px; min-height:44px;}
#lock .lk-err{color:#FFB3AE; font-size:13.5px; font-weight:600; margin:10px 2px 0; min-height:18px;}
#lock .lk-btn{width:100%; border:0; background:var(--amber); color:#141414; font-weight:700;

/* gate hardening: app stays unrendered AND hidden until unlocked */

/* view transitions + touch feedback */

.tile, .rowitem, .favbtn, .copy, .linkbtn, .fchip{transition:transform .08s ease;}
.tile:active, .rowitem:active{transform:scale(.975);}
.copy:active, .favbtn:active, .linkbtn:active, .fchip:active{transform:scale(.94);}

/* tile icons */
.tile .tico{flex:none; width:44px; height:44px; border-radius:12px; display:flex;

.tile .tico svg{display:block; width:24px; height:24px;}
.tile:focus-visible, .rowitem:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

/* home favorites/recents action buttons */
.rowwrap{display:flex; align-items:center; gap:8px; transition:opacity .28s, transform .28s;}
