<script>
(function () {
  var form = document.getElementById('lockform');
  var lock = document.getElementById('lock');
  var pw = document.getElementById('lockpw');
  var err = document.getElementById('lockerr');
  var show = document.getElementById('lockshow');
  var rem = document.getElementById('lockrem');
  if (!form || !lock) return;
  try { if (rem && localStorage.getItem('tbx_rm') === '1') rem.checked = true; } catch (e) {}
  var busy = false;
  var payload = null;

  function b64d(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function b64e(buf) {
    var a = new Uint8Array(buf), s = '';
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function getPayload() {
    if (payload) return Promise.resolve(payload);
    return fetch('payload.enc.json').then(function (r) {
      if (!r.ok) throw new Error('payload http ' + r.status);
      return r.json();
    }).then(function (j) { payload = j; return j; });
  }
  function keyFromPassword(v, P) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(v), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', hash: 'SHA-256', salt: b64d(P.salt), iterations: P.it },
          km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }
  // A password that isn't the primary one may still hold the content key in a wrap
  // (same salt, so one PBKDF2 covers every attempt). Resolves the content key or rejects.
  function unwrapWith(key, P) {
    var wraps = P.wraps || [], i = 0;
    function next() {
      if (i >= wraps.length) return Promise.reject(new Error('nowrap'));
      var w = wraps[i++];
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(w.iv) }, key, b64d(w.ct))
        .then(function (raw) { return crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['decrypt']); }, next);
    }
    return next();
  }
  function phase(p) { window.__tbxBootPhase = p; }
  function WrongKey(e) { this.name = 'WrongKey'; this.cause = e; }
  // P4: never throws — a boot exception keeps the saved key, resets __tbxBooted and shows the error card.
  function safeBoot(js) {
    try { bootWith(js); return true; } catch (e) { window.TBX_FAIL(window.__tbxBootPhase === 'eval' ? 'decode' : 'boot', e); return false; }
  }
  function bootWith(js) {
    phase('eval');
    (0, eval)(js);
    document.documentElement.classList.add('authed');
    window.dispatchEvent(new Event('tbx-unlock'));
    // The app script can still be downloading when a stored key finishes decrypting
    // (fresh app file after an update, slow wifi): remember, and boot when it lands.
    phase('boot');
    if (window.TBX_BOOT) { window.TBX_BOOT(); phase('booted'); } else { window.__tbxBootPending = true; phase('app'); }
  }
  function clearKeys() {
    try { sessionStorage.removeItem('tbx_k2'); } catch (e) {}
    try { localStorage.removeItem('tbx_k2'); } catch (e) {}
  }

  // auto-boot with a stored key (session, or "Remember me")
  var stored = null;
  try { stored = sessionStorage.getItem('tbx_k2') || localStorage.getItem('tbx_k2'); } catch (e) {}
  if (stored && window.crypto && crypto.subtle) {
    // P4: only a key that can never work (wrong key: AES-GCM OperationError, or a key that won't even import) clears the
    // saved login. Anything else (offline without data, a data or code bug) keeps it and shows the "didn't open" card.
    phase('fetch');
    getPayload().then(function (P) {
      phase('key');
      return Promise.resolve().then(function () { return crypto.subtle.importKey('raw', b64d(stored), 'AES-GCM', false, ['decrypt']); })
        .catch(function (e) { throw new WrongKey(e); })
        .then(function (key) {
          phase('decrypt');
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(P.iv) }, key, b64d(P.ct))
            .catch(function (e) { throw (e && e.name === 'OperationError') ? new WrongKey(e) : e; })
            .then(function (buf) { phase('decode'); return new TextDecoder().decode(buf); });
        });
    }).then(function (js) {
      safeBoot(js);
    }).catch(function (e) {
      if (e instanceof WrongKey) {               // the payload was re-encrypted (new salt) or the password changed
        clearKeys();
        document.documentElement.classList.remove('authed');
        var sub = document.querySelector('#lock .lk-sub'); if (sub) sub.textContent = 'Your saved login has expired — enter the team password.';
        return;
      }
      window.TBX_FAIL(window.__tbxBootPhase === 'fetch' ? 'fetch' : 'decode', e);   // offline without data, a data bug: keep the key
    });
  } else if (stored) {
    clearKeys();
    document.documentElement.classList.remove('authed');
  }

  show.addEventListener('click', function () {
    var hidden = pw.type === 'password';
    pw.type = hidden ? 'text' : 'password';
    show.textContent = hidden ? 'Hide' : 'Show';
    pw.focus();
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var v = (pw.value || '').trim();
    if (!v) { pw.focus(); return; }
    if (!(window.crypto && crypto.subtle)) {
      err.textContent = 'Unlock needs a secure (https) connection.';
      return;
    }
    busy = true;
    err.textContent = '';
    var P0, K0;
    getPayload().then(function (P) {
      P0 = P;
      return keyFromPassword(v, P);
    }).then(function (key) {
      K0 = key;
      var raw = function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(P0.iv) }, k, b64d(P0.ct)); };
      return raw(key).catch(function () {
        return unwrapWith(key, P0).then(function (k2) { K0 = k2; return raw(k2); });
      });
    }).then(function (buf) {
      // P4: the password is proven once decrypt succeeds, so the key is stored before decode and boot; a failure after
      // this point shows the "didn't open" card and is never reported as "Incorrect password".
      return crypto.subtle.exportKey('raw', K0).then(function (rawk) {
        var kb = b64e(rawk);
        try { sessionStorage.setItem('tbx_k2', kb); } catch (e2) {}
        try {
          if (rem && rem.checked) { localStorage.setItem('tbx_k2', kb); localStorage.setItem('tbx_rm', '1'); }
          else { localStorage.removeItem('tbx_k2'); localStorage.removeItem('tbx_rm'); }
        } catch (e3) {}
        pw.blur();
        phase('decode');
        Promise.resolve(new TextDecoder().decode(buf)).then(function (js) {
          var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (reduce) { safeBoot(js); }
          else {
            lock.classList.add('open');
            setTimeout(function () { safeBoot(js); }, 700);
          }
        }, function (e) { window.TBX_FAIL('decode', e); });
      });
    }).catch(function (e4) {
      busy = false;
      if (e4 && /payload/.test(String(e4.message || ''))) {
        err.textContent = 'Couldn’t load the app data — check your connection and try again.';
      } else {
        err.textContent = 'Incorrect password — check capitalization.';
      }
      lock.classList.remove('shake');
      void lock.offsetWidth;
      lock.classList.add('shake');
      pw.select();
    });
  });
})();
</script>
