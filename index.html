/* home refresh + sync status */
.cc-home{position:relative;}
.cc-rfb{position:absolute; top:10px; right:10px; width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  background:rgba(255,255,255,.05); color:var(--amber); font-size:19px; line-height:1; cursor:pointer; padding:0;}
.cc-rfb:disabled{opacity:.55;}
.cc-rfb.ok{color:#7ed99b; border-color:rgba(90,200,120,.6);}
.cc-rfb.spin{animation:ccspin .8s linear infinite;}
@keyframes ccspin{to{transform:rotate(360deg);}}
.cc-sync{margin-top:8px; font-size:var(--fs-xs); font-variant-numeric:tabular-nums; color:var(--muted); min-height:15px;}
/* iOS renders datetime-local with its own centered pill; normalize it to match .cc-in */
input[type="date"].cc-in, input[type="datetime-local"].cc-in{-webkit-appearance:none; appearance:none; display:block; width:100%;
  box-sizing:border-box; min-height:47px; text-align:left;}
input[type="datetime-local"].cc-in::-webkit-date-and-time-value{text-align:left; margin:0;}

/* cycle-count scan confirm: centered modal */
#cc-backdrop{position:fixed; inset:0; z-index:74; background:rgba(8,8,8,.72);}
#cc-sheet.cc-modal{left:50%; right:auto; top:50%; bottom:auto; transform:translate(-50%,-50%);
  width:min(430px, calc(100vw - 32px)); padding:24px 22px 22px; border-radius:24px; z-index:76;
  box-shadow:0 22px 66px rgba(0,0,0,.6);}
.cc-modal .cc-sh-h{font-size:19px; margin-bottom:6px;}
.cc-modal .cc-sub{font-size:14px; margin-bottom:0;}
.cc-modal .cc-qlabel{color:var(--muted); font-size:11.5px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; margin:18px 0 0;}
.cc-modal .cc-qtyrow{gap:16px; margin-top:8px;}
.cc-modal .cc-qbtn{width:60px; height:60px; font-size:28px;}
.cc-modal .cc-qin{width:98px; font-size:30px;}
.cc-modal .cc-sh-row{gap:14px; margin-top:24px;}
.cc-modal .cc-sh-row button{flex:1; margin-top:0; padding:17px 0; font-size:17px; border-radius:999px;}
.cc-cancel{border:1px solid rgba(255,255,255,.34); background:rgba(255,255,255,.05); color:var(--bone);
  font-weight:800; cursor:pointer;}
/* Field Ops count sheet (cycle count) */
.fops-wrap{margin-top:18px; text-align:left;}
.fops-wrap.fops-top{margin:4px 0 18px;}
#cc-counts-lab{text-align:left; margin-top:4px;}
.fops-lab{font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:0 2px 6px; border-bottom:1px solid var(--line); margin-bottom:8px;}
.fops-home{display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px dashed var(--amber); border-radius:12px; background:rgba(253,181,21,.07); cursor:pointer;}
.fops-home:active{background:rgba(253,181,21,.14);}
.fops-ic{font-size:22px; line-height:1; flex:0 0 auto;}
.fops-chev{color:var(--muted); font-size:22px; line-height:1; flex:0 0 auto;}
.fops-t{font-weight:800; font-size:14.5px;}
.fops-sub{color:var(--muted); font-size:var(--fs-sm); margin-top:4px; line-height:1.4;}
.fops-sub b{color:var(--bone);}
.fops-dim{color:var(--muted);}
.fops-bar{height:6px; border-radius:999px; background:#2a3340; margin:10px 0 6px; overflow:hidden;}
.fops-fill{height:100%; background:var(--green); border-radius:999px; transition:width .3s;}
.fops-nums{display:flex; gap:12px; font-size:var(--fs-sm); font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px;}
.fops-nums .ok{color:#5fd6a4;} .fops-nums .miss{color:var(--amber);} .fops-nums .add{color:#8fb9ea;}
.fops-row{display:flex; gap:16px; align-items:center; margin-top:8px; flex-wrap:wrap;}
.fops-row-links{margin-top:6px; gap:22px;}
.fops-dl-wrap{text-align:center; margin:2px 0 10px;}
.cc-btn.cc-btn-out{background:transparent; color:var(--amber); border:2px solid var(--amber); padding:10px 20px; font-size:14px;}
.fops-btn{margin-top:4px; padding:10px 18px; font-size:14px;}
.fops-lnk{background:none; border:0; color:var(--muted); font:inherit; font-size:13px; font-weight:700; text-decoration:underline; cursor:pointer; padding:6px 0;}
.fops-lnk.danger{color:#FFB3AE;}
.fops-lnk.strong{color:var(--amber); text-decoration:none; border:1px solid var(--amber); border-radius:999px; padding:6px 12px;}
.fops-warn{margin-top:8px; padding:8px 10px; border-radius:10px; background:rgba(253,181,21,.12); color:var(--bone); font-size:var(--fs-sm); line-height:1.4;}
.fops-hint{margin:6px 0 2px; font-size:13px; font-weight:700;} .fops-hint.on{color:#5fd6a4;} .fops-hint.off{color:var(--amber);}
.fops-screen #fops-body{text-align:left;}
.fops-screen #fops-head.has-list{padding-bottom:14px; border-bottom:1px solid var(--line);}
.fops-screen .fops-intro{line-height:1.5; margin-bottom:14px;} .fops-screen .fops-intro b{color:var(--bone);}
.fops-screen #fops-head .fops-nums, .fops-screen #fops-head .fops-row{justify-content:center;}
.fops-screen #fops-head .fops-warn{text-align:left;}
.fops-screen .fops-bar{margin:12px auto 8px; max-width:340px;}
.fops-chips{margin:14px 0 6px; justify-content:center;} .fops-chips .chip{cursor:pointer; font:inherit; font-size:13px; font-weight:800; background:transparent;}
.fops-chips .chip[data-chip="missing"]{border-color:var(--amber); color:var(--amber);}
.fops-chips .chip[data-chip="found"]{border-color:#5fd6a4; color:#5fd6a4;}
.fops-chips .chip[data-chip="additional"]{border-color:#8fb9ea; color:#8fb9ea;}
.fops-chips .chip.dim{opacity:.6;}
.fops-chips .chip.on[data-chip="missing"]{background:var(--amber); color:#141414;}
.fops-chips .chip.on[data-chip="found"]{background:#5fd6a4; color:#141414;}
.fops-chips .chip.on[data-chip="additional"]{background:#8fb9ea; color:#141414;}
.fops-lot{color:var(--muted); font-weight:600; font-size:13px; margin-left:6px;}
/* The list is an inset, scrollable panel; on the Field Ops screen the page itself is locked (body.cc-fixed) and
   the panel takes every pixel left under the header, chips and search, down to the bottom of the screen. */
#fops-list{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; margin-top:8px; padding:8px;
  background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:14px;
  box-shadow:inset 0 10px 10px -10px rgba(0,0,0,.75), inset 0 -10px 10px -10px rgba(0,0,0,.75);}
#fops-list .ctc:first-child{margin-top:0;}
#fops-list .ctc{background:var(--panel);}
body.cc-fixed .fops-screen{flex:0 0 auto; width:100%; max-width:420px; margin:0 auto;}
body.cc-fixed .fops-screen.has-list{flex:1; min-height:0; display:flex; flex-direction:column; padding:16px 14px calc(var(--sab) + 14px);}   /* the panel ends a little above the card's bottom edge */
body.cc-fixed .fops-screen.has-list #fops-head{flex:0 0 auto;}
body.cc-fixed .fops-screen.has-list #fops-body{flex:1; min-height:0; display:flex; flex-direction:column;}
body.cc-fixed .fops-screen.has-list #fops-body > *{flex:0 0 auto;}
body.cc-fixed .fops-screen.has-list #fops-list{flex:1 1 auto; min-height:0; max-height:none; margin-bottom:0;}
.cc-note{margin:12px 0 2px; padding:9px 12px; border-radius:12px; background:rgba(253,181,21,.12);
  border:1px solid rgba(253,181,21,.42); color:var(--bone); font-size:13.5px; line-height:1.4;}
.cc-note b{color:var(--amber); font-size:16px;}
.cc-break{margin:12px 0 0; color:var(--muted); font-size:12.5px; line-height:1.5;}
/* cycle-count scanner: targeting box, scan flash, focus, expiry + required-lot */
#cc-target{position:absolute; left:14%; right:14%; top:19%; bottom:19%; pointer-events:none; z-index:4;}
#cc-target i{position:absolute; width:26px; height:26px;}
#cc-target i:nth-child(1){left:0; top:0; border-left:3px solid rgba(253,181,21,.95); border-top:3px solid rgba(253,181,21,.95); border-top-left-radius:6px;}
#cc-target i:nth-child(2){right:0; top:0; border-right:3px solid rgba(253,181,21,.95); border-top:3px solid rgba(253,181,21,.95); border-top-right-radius:6px;}
#cc-target i:nth-child(3){left:0; bottom:0; border-left:3px solid rgba(253,181,21,.95); border-bottom:3px solid rgba(253,181,21,.95); border-bottom-left-radius:6px;}
#cc-target i:nth-child(4){right:0; bottom:0; border-right:3px solid rgba(253,181,21,.95); border-bottom:3px solid rgba(253,181,21,.95); border-bottom-right-radius:6px;}
#cc-flash{position:absolute; inset:0; pointer-events:none; z-index:6; border-radius:16px; opacity:0;
  box-shadow:inset 0 0 0 3px #35D07F, inset 0 0 34px 7px rgba(53,208,127,.85);}
#cc-flash.go{animation:ccflash 2.1s ease-out forwards;}
@keyframes ccflash{0%{opacity:0;} 7%{opacity:1;} 100%{opacity:0;}}
.cc-help{position:absolute; right:10px; top:48px; border:0; background:rgba(0,0,0,.45); color:#fff;
  border-radius:999px; width:36px; height:36px; font-size:18px; font-weight:800; line-height:1; z-index:5;}
.cc-help:active{background:var(--amber); color:#141414;}
.cc-help-steps{text-align:left; font-size:13px; line-height:1.5; color:var(--muted); margin:10px 0 4px;}
.cc-focus{position:absolute; right:10px; top:48px; border:0; background:rgba(0,0,0,.45); color:#fff;
  border-radius:999px; width:36px; height:36px; font-size:18px; line-height:1; z-index:5;}
.cc-focus:active{background:var(--amber); color:#141414;}
.cc-exptag{display:inline-block; margin:6px 0 2px; padding:3px 11px; border-radius:999px;
  background:#B3261E; color:#fff; font-weight:800; font-size:12px; letter-spacing:.05em;}
.ccr-exp{display:inline-block; margin-left:7px; padding:1px 7px; border-radius:999px;
  background:#B3261E; color:#fff; font-weight:800; font-size:10.5px; letter-spacing:.04em; vertical-align:middle;}
.cc-in.cc-need{border-color:#FF8A85; box-shadow:0 0 0 2px rgba(255,138,133,.28);}
.cc-hint{color:#FF8A85; font-size:12px; margin:2px 0 0; text-align:center;}
.about-quote .aq-by{display:block; margin-top:7px; font-style:normal; color:var(--muted); font-size:11px; letter-spacing:.08em;}
#content.homeview .a2hs{margin-top:10px;}
#content.homeview .foot{margin-top:auto; padding-top:12px;}
.tile-scan{border:1.5px dashed #7a6426;}
.tile-scan b{color:var(--amber);}
.tile-scan .tico{background:rgba(253,181,21,.14); border-style:dashed;}

/* what's new — floating card at top */
#wncard{position:fixed; left:10px; right:10px; top:calc(var(--sat) + var(--hdr-pad) + var(--hdr-row) + 8px); z-index:78;
  background:var(--panel); border:1px solid #6b5a2a; border-left:4px solid var(--amber);
  border-radius:12px; padding:12px 14px; margin:0; box-shadow:0 10px 28px rgba(0,0,0,.5);
  animation:wnin .3s ease; max-height:calc(100dvh - 220px); overflow-y:auto;}
@keyframes wnin{from{opacity:0; transform:translateY(-12px);} to{opacity:1; transform:none;}}
#wncard.bye{opacity:0; transform:translateY(-10px); transition:opacity .25s, transform .25s;}
#wncard .wn-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
#wncard .wn-h span{color:var(--amber); font-weight:800; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase;}
#wndismiss{border:0; background:none; color:var(--muted); font-size:15px; padding:0; min-width:44px; min-height:44px; margin:-6px -8px -6px 0;
  display:flex; align-items:center; justify-content:center;} /* P17: a 44 pt target around the line close icon */
.wn-i{display:block; width:100%; text-align:left; background:none; border:0; color:var(--bone);
  font:inherit; font-size:13.5px; line-height:1.45; padding:5px 0; border-top:1px solid var(--line);}
.wn-i:first-of-type{border-top:0;}
.wn-i b{color:var(--muted); font-weight:700; font-size:11.5px; margin-right:6px;}
button.wn-i{cursor:pointer;} button.wn-i:active{background:var(--panel2);}
#wncard .wn-i.wn-x{display:none;}
#wncard.open .wn-i.wn-x{display:block;}
#wnmore{display:block; width:100%; background:none; border:0; color:var(--amber);
  font-weight:700; font-size:13px; text-align:left; padding:9px 0 2px; cursor:pointer;}
/* expiration banner */
#expban{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:80;
  width:min(300px, calc(100% - 48px)); border-radius:20px; padding:22px 18px 20px; text-align:center;
  box-shadow:0 12px 34px rgba(0,0,0,.55); animation:xbpop .22s ease-out;}
@keyframes xbpop{from{opacity:0; transform:translate(-50%,-50%) scale(.92);} to{opacity:1; transform:translate(-50%,-50%) scale(1);}}
#expban.expired{background:#4A1214; border:1.5px solid #D06A68; color:#FFC9C5;}
#expban.soon{background:#3A2A14; border:1.5px solid #8a6420; color:#FFD98A;}
#expban .xb-ico{font-size:30px; line-height:1; margin-bottom:8px;}
#expban .xb-t{font-size:19px; font-weight:800; letter-spacing:.3px; line-height:1.25;}
#expban.expired .xb-t{color:#FF8A85;}
#expban.soon .xb-t{color:var(--amber);}
#expban .xb-days{margin-top:4px; font-size:13.5px; font-weight:700;}
#expban .xb-sub{margin-top:7px; font-size:15px; font-weight:600;}
#expban .xb-dn{margin-top:9px; font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#FF8A85;}
#expban #expban-x{position:absolute; right:4px; top:4px; border:0; background:none; color:inherit;
  font-size:14px; padding:9px; cursor:pointer; opacity:.85;}
/* part-number change popup (retired numbers still in circulation) */
#pnmove{position:fixed; inset:0; z-index:85; background:rgba(12,12,12,.78); display:flex;
  align-items:center; justify-content:center; padding:24px; animation:vtin .2s ease;}
#pnmove .pnm-card{position:relative; width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line);
  border-top:3px solid var(--amber); border-radius:18px; padding:22px 20px 18px; text-align:center; box-shadow:0 12px 34px rgba(0,0,0,.55);}
#pnmove .pnm-x{position:absolute; right:4px; top:4px; border:0; background:none; color:var(--muted); font-size:15px; padding:10px; cursor:pointer;}
#pnmove .pnm-eyebrow{font-size:11.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--amber);}
#pnmove .pnm-map{display:flex; align-items:center; justify-content:center; gap:12px; margin:14px 0 10px;}
#pnmove .pnm-pn{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0;}
#pnmove .pnm-pn span{font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
#pnmove .pnm-pn b{font-size:17px; font-weight:700; color:var(--dim);}
#pnmove .pnm-pn.now b{color:var(--amber);}
#pnmove .pnm-arrow{font-size:20px; color:var(--muted); padding-top:14px;}
#pnmove .pnm-name{font-size:15px; font-weight:700; line-height:1.35;}
#pnmove .pnm-note{margin:10px 0 16px; color:#CFCBC4; font-size:13.5px; line-height:1.5; text-align:left;}
#pnmove .pnm-ok{width:100%; border:0; background:var(--amber); color:#141414; font-weight:700;
  font-size:16px; border-radius:12px; min-height:48px; cursor:pointer;}
#pnmove .pnm-ok:active{background:var(--amber-press);}
.pnm-sr{display:block; width:100%; box-sizing:border-box; text-align:left; margin:4px 0 10px; padding:11px 12px; border-radius:10px;
  border:1px solid #6b5a2a; border-left:3px solid var(--amber); background:#2E2C28; color:var(--bone);
  font-family:inherit; font-size:13.5px; line-height:1.45; cursor:pointer;}
.pnm-sr b{color:var(--amber);}
.pnm-sr .pnm-why{color:var(--amber); font-weight:700; white-space:nowrap;}
/* welcome tour */
#tour{position:fixed; inset:0; z-index:90; background:rgba(12,12,12,.92); display:flex;
  align-items:center; justify-content:center; padding:24px; animation:vtin .25s ease;}
#tour .tr-card{width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line);
  border-radius:20px; padding:30px 24px 20px; text-align:center;}
#tour .tr-ico{width:64px; height:64px; margin:0 auto 18px; border-radius:18px;
  background:rgba(253,181,21,.12); border:1px solid rgba(253,181,21,.2);
  display:flex; align-items:center; justify-content:center;}
#tour h2{margin:0 0 8px; font-size:20px; font-weight:700;}
#tour p{margin:0 0 20px; color:var(--muted); font-size:14.5px; line-height:1.55;}
#tour .tr-dots{display:flex; gap:7px; justify-content:center; margin-bottom:18px;}
#tour .tr-dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
#tour .tr-dot.on{background:var(--amber);}
#tour .tr-next{width:100%; border:0; background:var(--amber); color:#141414; font-weight:700;
  font-size:16px; border-radius:12px; min-height:50px; cursor:pointer;}
#tour .tr-next:active{background:var(--amber-press);}
#tour .tr-skip{border:0; background:none; color:var(--muted); font-weight:600; font-size:13.5px;
  margin-top:10px; padding:8px; cursor:pointer;}
/* add-to-home-screen */
.a2hs{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px dashed #6b5a2a;
  border-radius:14px; padding:12px 14px; margin-top:14px;}
.a2hs .ai{flex:none; width:38px; height:38px; border-radius:10px; background:rgba(253,181,21,.1);
  display:flex; align-items:center; justify-content:center;}
.a2hs .at{flex:1; min-width:0;}
.a2hs .at b{display:block; font-size:14px;}
.a2hs .at span{display:block; color:var(--muted); font-size:12px; margin-top:1px;}
.a2hs .ago{flex:none; border:1.5px solid var(--amber); background:none; color:var(--amber);
  font-weight:700; font-size:13px; border-radius:999px; padding:8px 14px; cursor:pointer;}
.a2hs .ax{flex:none; border:0; background:none; color:var(--muted); font-size:15px; padding:6px 4px; cursor:pointer;}
#a2hs-sheet{position:fixed; inset:0; z-index:92; background:rgba(0,0,0,.62); display:flex; align-items:flex-end;}
#a2hs-sheet[hidden]{display:none;}
#a2hs-sheet .as-card{width:100%; background:var(--panel); border-radius:20px 20px 0 0;
  padding:22px 20px calc(var(--sab) + 22px); border-top:1px solid var(--line);}
#a2hs-sheet h3{margin:0 0 12px; font-size:17px;}
#a2hs-sheet ol{margin:0 0 18px; padding-left:22px; font-size:14.5px; line-height:2;}
#a2hs-sheet .as-close{width:100%; border:1px solid var(--line); background:var(--panel2); color:var(--bone);
  font-weight:700; font-size:15px; border-radius:12px; min-height:46px; cursor:pointer;}
/* about */
.footlink{border:0; background:none; color:var(--amber); font-weight:700; font-size:12.5px; padding:6px 8px; cursor:pointer;}
.footsep{color:var(--muted); margin:0 2px;}
.tip{font-size:14px; line-height:1.55; padding:10px 0; border-top:1px solid var(--line); text-align:left;}
.tip:first-child{border-top:0; padding-top:2px;}
.tip b{color:var(--amber);}

/* photo viewer (P32 / N7): swipe between a card's photos, pinch / double-tap zoom, "2 / 4" at the top, Close at the bottom */
#lb{position:fixed; inset:0; z-index:110; display:block; overflow:hidden; background:#0B0B0B; touch-action:none;}
#lb[hidden]{display:none;}
#lb-track{position:absolute; inset:0; display:flex; will-change:transform;}
.lb-s{flex:0 0 100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden;
  padding:calc(var(--sat) + 50px) 0 calc(var(--sab) + 104px);}
.lb-s img{max-width:100%; max-height:100%; background:#fff; transform-origin:0 0; user-select:none; -webkit-user-select:none; -webkit-user-drag:none;}
#lb-top{position:absolute; left:0; right:0; top:0; display:flex; align-items:baseline; gap:10px; padding:calc(var(--sat) + 14px) 16px 14px;
  background:linear-gradient(rgba(11,11,11,.92), rgba(11,11,11,0)); color:var(--bone); pointer-events:none;}
#lb-n{flex:none; font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
#lb-title{flex:1; min-width:0; color:#CFCBC4; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#lb-bot{position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:16px 16px calc(var(--sab) + 12px); background:linear-gradient(rgba(11,11,11,0), rgba(11,11,11,.94) 40%); pointer-events:none;}
#lb-hint{color:var(--muted); font-size:12px; pointer-events:none;}
#lb-close{pointer-events:auto; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-width:132px; height:48px; padding:0 22px;
  border-radius:999px; border:1px solid #56524A; background:rgba(42,42,42,.96); color:var(--bone); font:inherit; font-size:16px; font-weight:700; cursor:pointer;}
#lb-close:active{background:#1c1c1c;}
/* prev / next: shown for mouse pointers; on touch screens they stay reachable by VoiceOver but take no space */
.lb-nav{position:absolute; top:50%; margin-top:-24px; width:48px; height:48px; border-radius:50%; border:1px solid #56524A; background:rgba(42,42,42,.9);
  color:var(--bone); font-size:26px; line-height:1; cursor:pointer;}
#lb:not(.lb-multi) .lb-nav{display:none;}
#lb-prev{left:10px;} #lb-next{right:10px;}
.lb-nav:disabled{opacity:.3; cursor:default;}
@media (hover:none), (pointer:coarse){ .lb-nav{width:1px; height:1px; margin:0; padding:0; border:0; overflow:hidden; clip-path:inset(50%);} }
#content img{cursor:zoom-in;}

/* barcode scanner */
#bottombar{display:flex; gap:10px; align-items:center;}
/* P18 landscape: side safe areas + compact bars on catalog screens (CC / F&A untouched) */
body:not(.ct-chrome-off) #bar{padding-left:max(14px, var(--sal, 0px)); padding-right:max(14px, var(--sar, 0px));}
body:not(.ct-chrome-off) #bar::after{margin-left:calc(-1 * max(14px, var(--sal, 0px))); margin-right:calc(-1 * max(14px, var(--sar, 0px)));}
body:not(.ct-chrome-off) main{padding-left:max(14px, var(--sal, 0px)); padding-right:max(14px, var(--sar, 0px));}
#bottombar{padding-left:max(14px, var(--sal, 0px)); padding-right:max(14px, var(--sar, 0px));}
body:not(.ct-chrome-off) #fb-fab{right:max(14px, var(--sar, 0px));}
#glosspanel{left:max(12px, var(--sal, 0px)); right:max(12px, var(--sar, 0px));}
@media (orientation:landscape) and (max-height:500px){
  body:not(.ct-chrome-off){--hdr-row:calc(44px / var(--z)); --hdr-pad:calc(6px / var(--z));}
  #bottombar{padding-top:6px; padding-bottom:calc(var(--sab) + 6px);}
  #bottombar .search input{height:44px;} #bottombar #scanbtn, #bottombar #bb-back{height:44px;}
  body:not(.ct-chrome-off) main{padding-bottom:calc(var(--sab) + 72px);}
  body:not(.ct-chrome-off) #fb-fab{bottom:calc(62px + var(--sab));}
  body:not(.ct-chrome-off) #updbanner{bottom:calc(var(--sab) + 62px);}
}
/* P11 / P24: the search pill and its input may shrink, so the scan button stays on a 320 pt screen with the clear button in */
#bottombar .search{flex:1 1 auto; min-width:0; margin:0;}
.search input{min-width:0; width:100%;}
@media (max-width:359px){ #bottombar{gap:6px; padding-left:12px; padding-right:12px;} #bottombar #scanbtn{width:48px;} #bottombar #bb-back{width:44px;}
  #bottombar .search{padding:0 10px; gap:8px;} }
/* P36: Back within thumb reach, shown exactly when the header Back is */
#bb-back{flex:none; width:48px; height:52px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel);
  color:var(--bone); display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer;}
#bb-back[hidden]{display:none;}
#bb-back:active{background:var(--panel2);}
/* P20: recent searches, one scrolling row sitting on top of the bar (it rides above the keyboard with the bar, never pushes it) */
.qrs{position:absolute; left:0; right:0; bottom:100%; display:flex; gap:8px; align-items:center; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  padding:8px max(14px, var(--sar, 0px)) 8px max(14px, var(--sal, 0px)); background:rgba(30,30,30,.94); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:1px solid var(--line);}
.qrs[hidden]{display:none;}
.qrs::-webkit-scrollbar{display:none;}
.qrl{flex:none; font-size:var(--fs-xs); font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
.qrc{flex:none; max-width:14em; overflow:hidden; text-overflow:ellipsis; min-height:44px; border:1.5px solid #5a564e; background:var(--panel); color:var(--bone);
  border-radius:999px; padding:0 14px; font:inherit; font-weight:700; font-size:13px; white-space:nowrap; cursor:pointer;}
.qrc:active{transform:scale(.96);}
.qrx{flex:none; min-height:44px; border:0; background:none; color:var(--amber); font:inherit; font-weight:700; font-size:12.5px; padding:0 8px; cursor:pointer;}
body.qr-on #fb-fab{visibility:hidden;}
/* P24: always-visible clear; the native iOS clear (focus-only) is hidden so there is only ever one clear button */
#q::-webkit-search-cancel-button{-webkit-appearance:none; appearance:none; display:none;}
#qclear{flex:none; width:44px; height:44px; margin-right:-10px; border:0; border-radius:50%; background:none; color:var(--muted);
  display:flex; align-items:center; justify-content:center; cursor:pointer;}
#qclear[hidden]{display:none;}
#qclear:active{background:var(--panel2); color:var(--bone);}
#scanbtn{flex:none; width:52px; height:52px; border-radius:var(--radius); border:1px solid var(--line);
  background:var(--panel); color:var(--amber); display:flex; align-items:center; justify-content:center;}
#scanbtn:active{background:var(--panel2);}
#scan-ov{position:fixed; inset:0; z-index:120; background:#000; display:flex; flex-direction:column;}
#scan-ov[hidden]{display:none;}
#scan-video{flex:1; width:100%; object-fit:cover; background:#111;}
#scan-top{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center;
  padding:calc(var(--sat) + var(--hdr-pad)) 14px 10px; background:linear-gradient(rgba(0,0,0,.6), transparent);}
#scan-top b{color:#fff; font-size:16px;}
#scan-close{width:44px; height:44px; border-radius:50%; border:1px solid #56524A; background:rgba(42,42,42,.94);
  color:#fff; font-size:18px;}
.scan-actions{display:flex; gap:10px; align-items:center;}
#scan-torch{width:44px; height:44px; border-radius:50%; border:1px solid #56524A; background:rgba(42,42,42,.94);
  color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
#scan-torch[hidden]{display:none;}
#scan-torch.on{background:var(--amber); border-color:var(--amber); color:#141414;}
#scan-frame{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
  width:72%; max-width:340px; aspect-ratio:1.6; border:2px solid rgba(253,181,21,.9); border-radius:14px;
  box-shadow:0 0 0 2000px rgba(0,0,0,.25); pointer-events:none;}
#scan-status{position:absolute; left:0; right:0; bottom:calc(var(--sab) + 18px); text-align:center;
  color:#fff; font-size:14px; font-weight:600; padding:0 20px;}
#scan-teach{position:absolute; left:12px; right:12px; bottom:calc(var(--sab) + 12px); z-index:121;
  background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; max-height:60%; overflow:auto;}
#scan-teach[hidden]{display:none;}
#scan-teach .st-t{font-weight:800; font-size:15px; margin-bottom:4px;}
#scan-teach .st-c{color:var(--muted); font-size:12px; word-break:break-all; margin-bottom:10px;}
#scan-teach input{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  color:var(--bone); padding:11px 12px; font-size:16px; margin-bottom:8px;}
#scan-teach .st-r{display:block; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line);
  color:var(--bone); font:inherit; font-size:14px; padding:10px 2px;}
#scan-teach .st-r span{color:var(--amber); font-size:12px; display:block;}
/* ---- F&A v2 kit (shared list/tray/history pieces) ---- */
.k-scroll{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:4px}
.f2c{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;margin:8px 0}
.f2top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.f2top b{font-size:15px}
.f2chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.f2chip.ok{background:rgba(90,200,120,.18);color:#7ed99b}
.f2chip.soon{background:rgba(90,150,220,.2);color:#8fb9ea}
.f2chip.sb{background:rgba(240,180,60,.22);color:#f0c060}
.a2held{display:flex;align-items:center;gap:8px;margin:-4px 0 8px}
.f2chip.exp{background:rgba(240,90,90,.22);color:var(--danger)}
.f2desc{margin-top:2px;font-size:13px;color:var(--dim)}
.f2sub{margin-top:2px;font-size:12px;color:var(--muted)}
.f2qty{margin-top:4px;font-size:13px;color:var(--dim)}
.f2qty b{font-size:15px;color:var(--bone)}
.k-ban{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:rgba(90,200,120,.16);border:1px solid rgba(90,200,120,.4);color:var(--green-soft);border-radius:12px;padding:8px 12px;margin:0 0 10px}
.k-ban button{margin-left:auto;background:none;border:0;color:inherit;font-size:16px;padding:0 2px}
@keyframes kshake{0%,100%{transform:translateX(0)}
20%,60%{transform:translateX(-6px)}
40%,80%{transform:translateX(6px)}
}
.k-shake{animation:kshake .35s}
.k-red{color:var(--danger) !important}
.k-trow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;margin:6px 0;touch-action:pan-y}
.k-trow.k-lift{opacity:.92;transform:scale(1.02);box-shadow:0 6px 18px rgba(0,0,0,.5);position:relative;z-index:9}
.k-handle{cursor:grab;touch-action:none;padding:4px 6px;color:var(--muted);font-size:16px;line-height:1;user-select:none}
.k-tmain{flex:1;min-width:0}
.k-tt{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-ts{font-size:11px;color:var(--muted)}
.k-step{display:flex;align-items:center;gap:6px}
.k-step button{width:26px;height:26px;border-radius:8px;border:0;background:rgba(255,255,255,.12);color:var(--bone);font-size:15px}
.k-step b{min-width:16px;text-align:center}
.k-x{background:none;border:0;color:var(--danger);font-size:16px;padding:2px 6px}
.k-arrows{display:none}
.k-arrows button{width:24px;height:22px;border:0;border-radius:6px;background:rgba(255,255,255,.1);color:var(--dim)}
.f2bub{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(120,160,255,.18);color:#9db8ff;white-space:nowrap}
.k-bar{position:sticky;bottom:0;padding:8px 0 calc(var(--sab) + 10px);z-index:6;background:var(--panel)}
.fa2-trkp{margin:10px 0 4px;background:rgba(240,180,60,.12);border:1px solid rgba(240,180,60,.45);border-radius:14px;padding:10px 12px}
.fa2-trkp .t{font-weight:800;color:var(--amber);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.fa2-trkp .r{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.fa2-trkp .r:first-of-type{border-top:0}
.fa2-trkp .m{flex:1;min-width:0;font-size:13.5px}.fa2-trkp .m span{display:block;color:var(--muted);font-size:12px}
.fa2-trkp .r button{flex:none;border:0;border-radius:999px;background:var(--amber);color:#141414;font-weight:800;font-size:13px;padding:8px 12px}
.cc-in[type=date]{min-width:0;max-width:100%;box-sizing:border-box}
#fa2-more{margin:10px 0 14px}
.a2man{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;margin:8px 0}
.h-ev{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;margin:8px 0;cursor:pointer}
.h-ev.open{background:rgba(255,255,255,.07)}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.h-ty{font-size:15px;font-weight:700}
.h-sub{margin-top:3px;font-size:12px;color:var(--muted)}
.h-cnt{font-size:12px;color:var(--dim);white-space:nowrap}
.h-lines{margin-top:8px;border-top:1px solid rgba(255,255,255,.08);padding-top:6px}
.h-ln{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05)}
.h-ln:last-child{border-bottom:0}
.h-lref{min-width:0}
.h-lref b{display:block}
.h-lref span{font-size:11px;color:var(--muted)}
.h-act{margin-top:2px}
.h-dim{opacity:.5}
.a-busy{background:rgba(90,200,120,.25) !important;border-color:rgba(90,200,120,.6) !important;color:var(--green-soft) !important}
/* ---- polish: skeletons, empty states, pull-to-refresh, view transitions ---- */
/* R7 M0: the shimmer moves on the compositor (a band sliding over a static tint), same look and timing as before */
.skel{position:relative; overflow:hidden; border-radius:12px; margin:8px 0; background:rgba(255,255,255,.05);}
.skel::after{content:""; position:absolute; top:0; bottom:0; left:0; width:100%; background:linear-gradient(90deg, rgba(255,255,255,0) 25%, rgba(255,255,255,.06) 50%, rgba(255,255,255,0) 75%); transform:translateX(-100%); animation:skel 1.2s ease-in-out infinite;}
.skel.row{height:58px} .skel.line{height:14px; width:60%} .skel.sm{height:34px}
@keyframes skel{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.emp{text-align:center; padding:26px 12px 18px; color:var(--muted);}
.emp .ei{font-size:30px; line-height:1; margin-bottom:8px; opacity:.85}
.emp b{display:block; color:var(--bone); font-size:var(--fs-md); font-weight:700; margin-bottom:4px}
.emp span{display:block; font-size:var(--fs-sm); line-height:1.4}
.emp .ea{margin-top:12px}
/* P14 not-found screen, P17/P52 line icons */
.ico{display:inline-block; vertical-align:-4px; flex:none;}
.emp .ei .ico{width:30px; height:30px; color:var(--muted);}
.nf-acts{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:4px;}
.nf-btn{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border-radius:999px; border:1.5px solid var(--amber);
  background:rgba(253,181,21,.08); color:var(--amber); font:inherit; font-weight:700; font-size:14px; cursor:pointer;}
.nf-card .footlink{margin-top:10px;}
.a2i{display:inline-flex; vertical-align:-5px; color:var(--amber);}
/* P22 close spellings, P23 "Ask Nate to add …" */
.sfuzzy{margin:6px 2px 4px; padding:9px 12px; border-radius:10px; background:#3A2A14; border:1px solid #8A6420; color:#FFD98A; font-size:13px; font-weight:700; line-height:1.4;}
.askin{display:block; border:0; background:none; color:var(--amber); font:inherit; font-weight:700; font-size:13px; padding:6px 0 0; cursor:pointer; text-align:left;}
.emp .ea .askn{display:block; margin:0 auto 4px; min-height:44px;}
body.fa2-wide .emp{text-align:left; padding:16px 2px}
#ptr{position:fixed; top:calc(var(--sat) + var(--hdr-pad) + var(--hdr-row) + 26px); left:50%; transform:translate(-50%,-40px); z-index:9; width:34px; height:34px; border-radius:50%; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--amber); font-size:18px; opacity:0; transition:opacity .15s; pointer-events:none;}
#ptr.spin{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:translate(-50%,0) rotate(360deg)}}
.since{font-variant-numeric:tabular-nums}
.sheetlink{display:inline-block; margin-top:10px; color:var(--muted); font-size:var(--fs-xs); font-weight:700; text-decoration:none; letter-spacing:.04em; text-transform:uppercase}
.sheetlink:active{color:var(--amber)}
.hf{margin:6px 0 10px} .hf .cc-in{margin:6px 0 8px} .hf .fa2-chips{margin-bottom:6px}
.h-day{margin:14px 0 4px; font-size:var(--fs-xs); font-weight:800; color:var(--muted); letter-spacing:.1em; text-transform:uppercase}
.h-day:first-child{margin-top:4px}
/* Root swaps instantly (a crossfade dips to the dark backdrop mid-way = visible flicker);
   only the tapped title morphs into the card heading. */
::view-transition-old(root){animation:none; mix-blend-mode:normal; opacity:0}
::view-transition-new(root){animation:none; mix-blend-mode:normal}
::view-transition-group(tbx-title){animation-duration:.22s; animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(tbx-title){animation:none; opacity:0}
::view-transition-new(tbx-title){animation:none; height:100%; object-fit:none}
/* ---- Team Usage dashboard (#/usage) — one series (people), deep amber bars validated for the #2A2A2A panel ---- */
.ug{--ug-bar:#BF8600; --ug-bar-hi:#FDB515;}
.ug-live{position:relative; padding:16px;}
.ug-lh{display:flex; align-items:center; gap:8px; padding-right:40px; min-height:32px;}
.ug-dot{position:relative; flex:none; width:9px; height:9px; border-radius:50%; background:var(--green);}
/* R7 M0: the live pulse is a scaling ring (compositor), not an animated box-shadow */
.ug-dot::after{content:""; position:absolute; inset:0; border-radius:50%; background:rgba(76,201,122,.55); animation:ug-pulse 2s ease-out infinite;}
@keyframes ug-pulse{0%{transform:scale(1); opacity:1;}70%{transform:scale(2.8); opacity:0;}100%{transform:scale(2.8); opacity:0;}}
.ug-lt{font-size:var(--fs-xs); font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--green-soft);}
.ug-upd{color:var(--muted); font-size:var(--fs-sm);}
.ug-rf{top:14px; right:14px;}
.ug-rf.spin{animation:bo-spin .8s linear infinite;}
.ug-hero{display:flex; align-items:center; gap:14px; margin:10px 0 2px;}
.ug-hero b{font-size:56px; line-height:1; font-weight:700; color:var(--bone); letter-spacing:-1px;}
.ug-hero span{color:var(--dim); font-size:15px; line-height:1.35;}
.ug-hero em{font-style:normal; color:var(--muted); font-size:13px;}
.ug-sub{margin:18px 0 8px; font-size:var(--fs-xs); font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
.ug-tiles{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px;}
.ug-tile{min-width:0; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 10px 9px;}
.ug-tile span{display:block; color:var(--muted); font-size:11.5px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ug-tile b{display:block; margin-top:3px; font-size:21px; line-height:1.15; font-weight:700; color:var(--bone);}
.ug-note{margin-top:10px; color:#FFD98A; font-size:12.5px; line-height:1.4;}
.ug-chart{position:relative; display:flex; gap:6px; margin-top:2px;}
.ug-ya{flex:none; display:flex; flex-direction:column; justify-content:space-between; height:104px; margin-top:16px; min-width:14px;
  color:var(--muted); font-size:10.5px; line-height:1; text-align:right; font-variant-numeric:tabular-nums;}
.ug-ya span:first-child{transform:translateY(-5px);} .ug-ya span:last-child{transform:translateY(5px);}
.ug-pw{flex:1; min-width:0; padding-top:16px;}
.ug-plot{position:relative; height:104px; display:flex; align-items:flex-end; gap:2px; border-bottom:1px solid #4A4A4A;}
.ug-g{position:absolute; left:0; right:0; height:0; border-top:1px solid var(--line); pointer-events:none;}
.ug-g.g1{top:0;} .ug-g.g2{top:50%;} .ug-g.g3{display:none;}
.ug-col{position:relative; flex:1 1 0; min-width:0; height:100%; display:flex; align-items:flex-end; justify-content:center;
  margin:0; padding:0; border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent;}
.ug-col i{display:block; width:100%; max-width:24px; background:var(--ug-bar); border-radius:4px 4px 0 0; transition:background-color .12s;}
.ug-col.hi i{background:var(--ug-bar-hi);}
.ug-col.on i{background:#F8AE00;} .ug-col.hi.on i{background:#FFEB1B;} /* = brightness(1.3), without a filter animation */
.ug-col:focus{outline:none;} .ug-col:focus-visible{outline:2px solid var(--bone); outline-offset:1px; border-radius:4px;}
.ug-col.none::after{content:''; position:absolute; bottom:-2px; left:50%; width:3px; height:3px; margin-left:-1.5px; border-radius:50%; background:#4A4A4A;}
.ug-pk{position:absolute; left:50%; transform:translate(-50%, -4px); color:var(--bone); font-size:11px; font-weight:700; line-height:1; white-space:nowrap; pointer-events:none;}
.ug-xa{display:flex; gap:2px; margin-top:5px;}
.ug-xa span{flex:1 1 0; min-width:0; text-align:center; color:var(--muted); font-size:10.5px; white-space:nowrap;}
.ug-tip{position:absolute; top:-8px; left:0; z-index:3; background:#111; color:var(--bone); border:1px solid #4A4A4A; border-radius:8px;
  padding:5px 9px; font-size:12px; font-weight:600; white-space:nowrap; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.35);}
.ug-tbl{margin-top:10px;}
.ug-tbl summary{cursor:pointer; color:var(--amber); font-size:12.5px; font-weight:700; padding:4px 0;}
.ug-tbl table{width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px; font-variant-numeric:tabular-nums;}
.ug-tbl th{color:var(--muted); font-weight:700; text-align:right; padding:4px 6px; border-bottom:1px solid var(--line);}
.ug-tbl td{color:var(--dim); text-align:right; padding:4px 6px; border-bottom:1px solid #313131;}
.ug-tbl th:first-child, .ug-tbl td:first-child{text-align:left;}
.ug-gh{margin-top:22px;}
.ug-feed{padding:4px 0;}
.ug-rows{display:flex; flex-direction:column;}
.ug-ev{display:flex; align-items:flex-start; gap:10px; width:100%; box-sizing:border-box; padding:9px 14px; margin:0; background:none; border:0;
  border-bottom:1px solid #313131; color:var(--bone); font:inherit; font-size:13.5px; line-height:1.4; text-align:left;}
.ug-ev:last-child{border-bottom:0;}
button.ug-ev{cursor:pointer;} button.ug-ev:active{background:var(--panel2);}
.ug-when{flex:none; width:34px; padding-top:1px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums;}
.ug-what{flex:1; min-width:0; color:var(--dim); overflow-wrap:anywhere;}
.ug-what b{color:var(--bone); font-weight:600;}
.ug-who{display:block; margin-bottom:1px; color:var(--muted); font-size:11.5px; font-weight:600;}
.ug-sku{color:var(--amber); font-size:12px;}
.ug-dim{color:var(--muted);}
.ug-ev .ct, .ug-lr .ct{flex:none; color:var(--muted); font-size:18px; line-height:1.2;}
.ug-pill{display:inline-block; border:1px solid #5a564e; border-radius:6px; padding:0 6px; font-size:10.5px; font-weight:800; letter-spacing:.3px;
  text-transform:uppercase; color:var(--dim); vertical-align:1px; white-space:nowrap;}
.ug-pill.warn{background:#3A2A14; color:#FFD98A; border-color:#8A6420;}
.ug-pill.ok{background:#143A22; color:#9BE3B4; border-color:#3E8A55;}
.ug-filters{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:24px 0 10px;}
.ug-chip.on{background:var(--amber); border-color:var(--amber); color:#141414;}
.ug-incl{display:flex; align-items:center; gap:7px; margin-left:auto; padding:6px 2px; color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer;}
.ug-incl input{width:18px; height:18px; margin:0; accent-color:var(--amber);}
.ug-pcard{padding:14px 16px 16px;}
.ug-pcard > .ug-sub:first-child{margin-top:0;}
.ug-stale{opacity:.55; transition:opacity .2s;}
.ug-list{padding:4px 0;}
.ug-list > .ug-sub{margin:10px 14px 4px;}
.ug-lr{display:flex; align-items:center; gap:10px; width:100%; box-sizing:border-box; padding:10px 14px; margin:0; background:none; border:0;
  border-bottom:1px solid #313131; color:var(--bone); font:inherit; text-align:left;}
.ug-lr:last-child{border-bottom:0;}
button.ug-lr{cursor:pointer;} button.ug-lr:active{background:var(--panel2);}
.ug-lm{flex:1; min-width:0; font-size:14px; line-height:1.35; overflow-wrap:anywhere;}
.ug-lm b{font-weight:600;}
.ug-ls{display:block; margin-top:2px; color:var(--muted); font-size:12px;}
.ug-lc{flex:none; color:var(--bone); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums;}
.ug-err{font-family:ui-monospace, "SF Mono", Menlo, monospace; font-size:12px; color:#FFB3AE;}
.ug-more{display:block; width:100%; box-sizing:border-box; margin:0; padding:11px 14px; background:none; border:0; border-top:1px solid #313131;
  color:var(--amber); font:inherit; font-weight:700; font-size:13.5px; text-align:left; cursor:pointer;}
.ug-foot{margin:26px 0 8px; text-align:center; color:var(--muted); font-size:12px; line-height:1.6;}
.ug-gate{padding:18px 16px;}
.ug-gt{margin-bottom:6px; font-size:17px; font-weight:700;}
.ug-gmsg{min-height:18px; margin-top:10px; color:#FFB3AE; font-size:13px;}
/* N9 — "To review" under the Live card: Searches · Barcodes · Missing cards, row actions wrap on narrow phones */
.ug .ug-pill{margin:0;} /* the global .warn rule (banners) leaked a 14px bottom margin into .ug-pill.warn */
.ug-rqc{display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px 4px;}
.ug-rqc b{margin-left:5px; font-variant-numeric:tabular-nums;}
.ug-rqi{margin:6px 14px 8px; color:var(--muted); font-size:12.5px; line-height:1.45;}
.ug-rqr{padding:10px 14px; border-top:1px solid #313131;}
.ug-rqr.closed{opacity:.6;}
.ug-rqm{color:var(--bone); font-size:14px; line-height:1.35; overflow-wrap:anywhere;}
.ug-rqm b{font-weight:600;}
.ug-rqs{margin-top:2px; color:var(--muted); font-size:12px; line-height:1.4; overflow-wrap:anywhere;}
.ug-rqa{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.ug-rqb{min-height:40px; padding:0 10px; border:1.5px solid #5a564e; border-radius:999px; background:none; color:var(--bone); font:inherit; font-size:13px; font-weight:700; cursor:pointer;}
.ug-rqb:active{background:var(--panel2);}
.ug-rqe{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:8px;}
.ug-rqe .cc-in{flex:1 1 180px; min-width:0; width:auto; margin:0; padding:9px 12px;}
.ug-rqf{display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; padding:6px 14px 8px; border-top:1px solid #313131;}
.ug-rqf .ug-rqt{margin-left:0;}
.ug-rqf .ug-rqg{margin-left:auto; padding:8px 0;}
.ug-rqoff{margin:0 2px; color:var(--muted); font-size:12.5px;}
.foot .ugver{-webkit-user-select:none; user-select:none;}
@media (max-width:360px){.ug-tiles{grid-template-columns:repeat(2, minmax(0, 1fr));} .ug-hero b{font-size:48px;}}
/* P4 — "ToolBox didn't open" card (above the lock, below nothing) */
#booterr{position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center; padding:24px 16px calc(24px + var(--sab, env(safe-area-inset-bottom, 0px)));
  background:var(--ink, #1E1E1E); color:var(--bone, #F4F2EE);}
#booterr[hidden]{display:none;}
#booterr .be-card{width:100%; max-width:340px; text-align:center;}
#booterr .be-ic{width:52px; height:52px; margin:0 auto 16px; border-radius:16px; background:#3a2a12; color:var(--amber, #FDB515);
  font:800 28px/52px -apple-system, system-ui, sans-serif;}
#booterr .be-t{font-size:21px; font-weight:700;}
#booterr .be-b{color:var(--bone, #F4F2EE); font-size:15px; line-height:1.5; margin:10px 0 8px;}
#booterr .be-safe{color:#9BD9A8; font-size:14px; line-height:1.5; margin:0 0 20px;}
#booterr .be-btn{width:100%; min-height:48px; border:0; border-radius:12px; background:var(--amber, #FDB515); color:#141414; font-weight:700; font-size:16px;}
#booterr .be-btn2{width:100%; min-height:48px; margin-top:10px; border:1px solid #555; border-radius:12px; background:none; color:var(--bone, #F4F2EE); font-weight:600; font-size:15px;}
#booterr .be-btn2:disabled{opacity:.7;}
#booterr .be-code{margin-top:18px; color:var(--muted, #9A958C); font:12px/1.5 ui-monospace, Menlo, monospace; word-break:break-word; -webkit-user-select:text; user-select:text;}
/* P40: 44 pt targets on catalog-only classes — an ::after hit area where the visual size should stay; real size inside
   scroll rows (a pseudo hit area would be clipped there). .ct-help alone (#/teams) and plain .chip (Field Ops) are CC: untouched. */
.ebrow{margin-bottom:12px;}
.clearrec{position:relative;} .clearrec::after{content:""; position:absolute; left:-8px; right:-8px; top:-16px; bottom:-12px;}
.bobanner .bo-more{position:relative;} .bobanner .bo-more::after{content:""; position:absolute; left:-8px; right:-8px; top:-16px; bottom:-14px;}
.footlink{min-height:44px; display:inline-flex; align-items:center; padding:0 10px;}
.chip.link{position:relative; display:inline-flex; align-items:center; min-height:36px;} .chip.link::after{content:""; position:absolute; inset:-5px -4px;}
.ct-help.bo-rf, .ct-help.ug-rf{width:40px; height:40px;} .bo-rf::after, .ug-rf::after{content:""; position:absolute; inset:-4px;}
.ct-help.bo-rf .ico, .ct-help.ug-rf .ico{display:block; margin:0 auto;}
.schip, .bochip{min-height:44px;}
.rwact{width:44px; height:44px;}
.a2hs .ax{min-width:44px; min-height:44px; margin:-10px -8px -10px 0; display:flex; align-items:center; justify-content:center;}
.fchip{min-height:40px; position:relative;} .fchip::after{content:""; position:absolute; inset:-2px 0;}
/* P41: line icons in catalog UI */
.favbtn .ico, .warn .ico{margin-right:6px; vertical-align:-4px;}
.favbtn .ico{width:18px; height:18px;}
#expban .xb-ico .ico{width:30px; height:30px;}
#expban #expban-x .ico, #pnmove .pnm-x .ico{width:18px; height:18px; display:block;}
.a2hs .ax .ico{width:18px; height:18px;}
.rwact .ico{width:20px; height:20px;}
.rwact.rwx .ico{width:17px; height:17px;}
.home-hint .ico, .tip .ico{width:16px; height:16px; vertical-align:-3px; color:var(--amber);}
.ug-lm .ico{width:15px; height:15px; vertical-align:-2px; color:var(--amber); margin-right:2px;}
.emp.home-hint{padding:6px 12px 2px;}
#scan-close svg{display:block; margin:auto; pointer-events:none;} #lb-close svg{flex:none; pointer-events:none;}
/* ---- R6 product card (N6 P28–P33 N13). Scoped to .pcard: the CC / F&A screens reuse .card, .chip and .chips.
   --rule-3 = table and tile lines at ≥3:1 (the shared --line stays as it is). The part-number band sticks under the
   header: --hdr-h is the header's measured height (set by the app), with the same sum as the CSS fallback. */
:root{--rule-3:#767676;}
.pcard{padding-top:16px;}
.pc-head{display:flex; align-items:flex-start; gap:12px; margin:0 0 12px;}
.pc-tt{flex:1; min-width:0;}
.pcard h1{margin:0; line-height:1.28;}
.pcard .fam{margin:5px 0 0; color:var(--muted); font-size:13px; line-height:1.35;}
.pc-hero{flex:none; width:clamp(56px, 17vw, 72px); height:clamp(56px, 17vw, 72px); padding:0; margin:0; border:1px solid var(--line); border-radius:12px;
  background:#fff; overflow:hidden; cursor:zoom-in;}
/* the whole photo, never a crop: most first photos are wide brochure panels or tall tips, and a square crop shows a fragment */
.pc-hero img{display:block; width:100%; height:100%; padding:3px; object-fit:contain;}
/* P30 status: one tappable line per status; details open under it */
.pcard > .bobanner{display:flex; flex-direction:column; gap:6px; margin:0 0 12px; padding:0; background:none; border:0; border-radius:0;}
.st-row{border:1px solid var(--line); border-radius:10px; background:var(--panel2);}
.st-row.st-bo{border-color:#8E4745; background:#2E1C1B;}
.st-row.st-ctl{border-color:#8A6420; background:#2D2416;}
.st-row.st-clr{border-color:#3E8A55; background:#17291E;}
.st-l{display:flex; align-items:center; gap:9px; width:100%; min-height:44px; padding:8px 12px; margin:0; background:none; border:0; color:var(--bone);
  font:inherit; font-size:14.5px; font-weight:700; line-height:1.3; text-align:left; cursor:pointer;}
.st-bo .st-l{color:#FFCDC9;} .st-ctl .st-l{color:#FFD98A;} .st-clr .st-l{color:#BFE9CC;}
.st-l .bopill{flex:none; font-size:12px; top:0;}
.st-l .st-t{flex:1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.st-l .st-c{flex:none; font-size:21px; line-height:1; transition:transform .2s ease;}
.st-l[aria-expanded="true"] .st-c{transform:rotate(90deg);}
.st-d{padding:0 12px 8px;}
.pcard .st-d .bo-line{font-size:13.5px; font-weight:600; color:var(--bone); line-height:1.45;}
.pcard .st-d .bo-msg{color:#C9C5BE; font-size:13.5px; line-height:1.45; margin:6px 0 0;}
.pcard .st-d .bo-more{display:inline-flex; align-items:center; min-height:44px; margin:0; padding:0; border:0; background:none; color:var(--amber);
  font:inherit; font-size:14px; font-weight:700; cursor:pointer;}
/* N13 collapsible: grid rows 0fr → 1fr (animates in iOS Safari 16+, older versions just open); hidden content leaves the tab order */
.coll{display:grid; grid-template-rows:0fr; visibility:hidden; transition:grid-template-rows .22s ease, visibility 0s linear .22s;}
.coll.open{grid-template-rows:1fr; visibility:visible; transition:grid-template-rows .22s ease, visibility 0s;}
.coll > .coll-in{min-height:0; overflow:hidden;}
.pcard > .warn{margin:0 0 12px;}
/* N6 key facts: existing spec rows lifted into tiles (not repeated in the table) */
.kf{display:flex; flex-wrap:wrap; gap:1px; margin:0 0 12px; background:var(--rule-3); border:1px solid var(--rule-3); border-radius:12px; overflow:hidden;}
.kf-i{flex:1 1 92px; min-width:0; padding:9px 11px 10px; background:var(--panel2);}
.kf-i.kf-long{flex-grow:1.6;}
.kf-k{display:block; color:#B9B5AE; font-size:12px; font-weight:800; line-height:1.25; letter-spacing:.06em; text-transform:uppercase;}
.kf-v{display:block; margin-top:3px; color:var(--bone); font-size:17px; font-weight:700; line-height:1.25; overflow-wrap:anywhere; font-variant-numeric:tabular-nums;}
.kf-long .kf-v{font-size:15.5px;}
/* N6 sticky part-number band: part #, unit, Copy / Favorite / Share icons */
.pcard > .pnblock{position:sticky; top:var(--hdr-h, calc(var(--sat) + var(--hdr-pad) + var(--hdr-row) + 11px)); z-index:5; display:flex; flex-wrap:wrap;
  align-items:center; gap:8px 10px; margin:0 -16px; padding:8px 16px; background:var(--panel); border:0; border-radius:0;
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
.pn-v{flex:1 1 auto; min-width:0;}
.pcard > .pnblock .num{font-size:clamp(17px, 5.3vw, 23px); font-weight:600; letter-spacing:.3px; line-height:1.15; color:var(--amber); white-space:nowrap;}
.pcard > .pnblock .num.pn-l{font-size:clamp(15px, 4.6vw, 23px);}
.pn-u{margin-top:2px; color:#B9B5AE; font-size:12.5px; line-height:1.2;}
.pn-i{flex:none; display:flex; gap:6px; margin-left:auto;}
.cd-ico{flex:none; width:44px; height:44px; padding:0; margin:0; border:1px solid var(--line); border-radius:12px; background:var(--panel2); color:var(--bone);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;}
.cd-ico:active{background:var(--ink);}
.cd-ico.on{color:var(--amber); border-color:#6B5A2A;}
.cd-ico.on .st-f{fill:var(--amber);}
.cd-ico svg{display:block;}
/* 320-pt screens: the part # and the three icons stay on one line (12-character numbers included) */
@media (max-width:359px){ .pcard > .pnblock{padding:8px 12px; column-gap:8px;} .pn-i{gap:4px;} .pcard > .pnblock .num.pn-l{font-size:15px;} }
/* P28 / P29 related links: one ≥44 pt amber chevron pill */
.cd-rel{margin:12px 0 0;}
.rel-row{display:flex; flex-wrap:wrap; gap:8px;}
.coll .rel-row{padding-top:8px;}
.rel{display:inline-flex; align-items:center; gap:6px; min-height:44px; margin:0; padding:9px 14px; border-radius:999px; border:1.5px solid rgba(253,181,21,.6);
  background:rgba(253,181,21,.08); color:var(--amber); font:inherit; font-size:14px; font-weight:700; line-height:1.25; text-align:left; text-decoration:none; cursor:pointer;}
.rel::after{content:"\203A"; font-size:18px; line-height:1;}
.rel:active{background:rgba(253,181,21,.18);}
.rel.rel-more{border-color:#6F6A61; background:var(--panel2); color:var(--bone);}
.rel.rel-more::after{content:"\25BE"; font-size:12px;}
.rel.rel-more[aria-expanded="true"]::after{content:"\25B4";}
/* N6 jump chips (Specs · Diagrams · Sources) */
.cd-jump{display:flex; gap:8px; margin:12px -16px 0; padding:0 16px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.cd-jump::-webkit-scrollbar{display:none;}
.cd-j{flex:none; min-height:44px; margin:0; padding:0 15px; border-radius:999px; border:1.5px solid #6F6A61; background:var(--panel2); color:var(--bone);
  font:inherit; font-size:13.5px; font-weight:700; white-space:nowrap; cursor:pointer;}
.cd-j:active{background:var(--ink);}
.pcard [tabindex="-1"]:focus{outline:none;}
/* P31 spec table: 16 px values, 13 px labels, ≥3:1 row lines */
.cd-specs{margin:14px 0 0;}
.pcard .ledger{border-top:1px solid var(--rule-3);}
.pcard .ledger .lr{padding:11px 2px; border-bottom:1px solid var(--rule-3); align-items:baseline;}
.pcard .ledger .lk{font-size:13px; line-height:1.35; color:#B9B5AE;}
.pcard .ledger .lv{font-size:16px; font-weight:600; line-height:1.4;}
.pcard .ledger .lhead{border-bottom-color:var(--rule-3);}
/* P33 */
.cd-soon{padding:12px 2px; color:var(--muted); font-size:14px; border-top:1px solid var(--rule-3); border-bottom:1px solid var(--rule-3);}
.cd-todo{display:inline-block; margin:10px 0 0; padding:4px 10px; border:1px dashed #8A6420; border-radius:8px; color:#FFD98A; font-size:12px; font-weight:700;}
/* labels, variants (size selector: neutral 44 pt chips, no chevron), Used with */
.pcard .cd-lab{margin:14px 0 0;}
.pcard .eyebrow.vhead{margin:18px 2px 8px;}
.pcard .cd-vars{margin:0;}
.pcard .cd-vars .chip.link{display:inline-flex; align-items:center; min-height:44px; padding:9px 14px; font-size:14px;}
.pcard > .bp{margin:16px 0 0;}
/* P32 photo strip: swipe, "1/4" counter, tap = viewer */
.cd-photos{margin:16px 0 0;}
.pgal{position:relative;}
.pgal-t{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; scrollbar-width:none;}
.pgal-t::-webkit-scrollbar{display:none;}
.pgal-s{flex:0 0 calc(100% - 28px); scroll-snap-align:start; position:relative; height:clamp(180px, 56vw, 260px); margin:0; padding:6px; border:1px solid var(--line);
  border-radius:12px; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:zoom-in;}
.pgal[data-n="1"] .pgal-s{flex-basis:100%; height:auto; max-height:420px; padding:0;}
.pcard .pgal-s img.photo{display:block; margin:0; border:0; border-radius:8px; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;}
.pcard .pgal[data-n="1"] .pgal-s img.photo{max-height:418px; border-radius:11px;}
/* SERFAS and shaver silhouettes keep their small size (as on the 4.143 card) */
.pcard .pgal .pgal-s img.photo-sm{max-width:110px; max-height:150px; border-radius:0;}
.pgal[data-n="1"] .pgal-s.sm{flex:0 0 auto; margin:0 auto; padding:8px;}
.pgal-n{position:absolute; top:8px; right:8px; min-width:40px; padding:3px 8px; border-radius:999px; background:rgba(20,20,20,.74); color:#fff;
  font-size:12.5px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; pointer-events:none;}
.pgal-z{position:absolute; right:8px; bottom:8px; width:28px; height:28px; border-radius:50%; background:rgba(20,20,20,.62); color:#fff;
  display:flex; align-items:center; justify-content:center; pointer-events:none;}
.pcard .cd-parts{margin:14px 0 0;}
.pcard .cd-src .src{margin-top:12px;}
/* ==== R7 motion (g4 M0 N1 N2 N3 N4 N10 N11 N12 N14) ============================================================
   One motion system: only transform and opacity animate (exceptions: colour changes <= 180 ms, spinners, direct
   manipulation, the cycle-count progress bar and R6's collapsible). Every reduced-motion override lives in the ONE
   @media block at the end of this <style>. Cycle count / F&A (body.ct-chrome-off) get no new motion. */
:root{
  --m-tap:90ms; --m-release:180ms; --m-quick:140ms; --m-exit:120ms; --m-base:220ms; --m-emph:300ms;
  --m-launch:480ms; --m-hold:900ms; --m-shimmer:1200ms;
  --e-out:cubic-bezier(.2,.8,.2,1); --e-in:cubic-bezier(.4,0,1,1); --e-inout:cubic-bezier(.65,0,.35,1); --e-spring:cubic-bezier(.34,1.56,.64,1);
  --m-rise:10px; --m-press-lg:.975; --m-press-sm:.94;
  /* N10 quiet category accents (glyph, 12% chip tint, 26% chip border); counts stay amber */
  --cat-allo:#FA9EBD; --cat-arth:#54D0EC; --cat-cap:#B6D16E; --cat-disp:#69D6AA; --cat-impl:#FDB515; --cat-inst:#BFCCDB; --cat-sut:#CAACFF; --cat-bo:#9CC9FF;
}
@keyframes tbx-out{to{opacity:0}}
@keyframes tbx-in{from{opacity:0}}
@keyframes tbx-rise{from{opacity:0; transform:translateY(var(--m-rise))} to{opacity:1; transform:none}}
@keyframes tbx-rise12{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
/* ---- the layered logo: stacked HTML layers, one <svg><use/></svg> per part (compositor-animated, never SVG internals) */
.lg{--sz:42px; position:relative; width:var(--sz); height:var(--sz); flex:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; pointer-events:none}
.lg.s72{--sz:72px} .lg.s96{--sz:96px}
.lg .lg-in, .lg .L{position:absolute; inset:0; display:block}
.lg .L svg{display:block; width:100%; height:100%}
.lg .l-tile{border-radius:22.5%; background:linear-gradient(#2D2D33, #151519); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.lg:not(.appicon) .l-tile, .lg:not(.appicon) .l-shadow{display:none} /* .appicon = the app-icon tile behind the box */
.lg .l-wrench, .lg .l-latch, .lg .l-halo, .lg .l-core, .lg .l-glint, .lg .l-spark{opacity:0}
.lg .l-lid{transform-origin:82.5% 47.4%}
.lg .l-latch{transform-origin:50% 51.8%}
.lg .l-core, .lg .l-halo, .lg .l-spark{transform-origin:50% 48.37%}
.lg .l-wrench{transform-origin:27.3% 62.5%}
.lg .l-glint{overflow:hidden;

  body:not(.ct-chrome-off) .rel:active, body:not(.ct-chrome-off) .cd-j:active, body:not(.ct-chrome-off) .qrc:active, body:not(.ct-chrome-off) .sfx:active,
  body:not(.ct-chrome-off) .nf-btn:active, body:not(.ct-chrome-off) #bb-back:active, body:not(.ct-chrome-off) #scanbtn:active{transform:none}

}

  show.addEventListener('click', function () {

      if (e4 && /payload/.test(String(e4.message || ''))) {

      } else {
